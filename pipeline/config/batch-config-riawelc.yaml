  crack: xray_crack_riawelc_lora_r32.safetensors
  porosity: xray_porosity_riawelc_lora_r32.safetensors
  lack_of_penetration: xray_lop_riawelc_lora_r32.safetensors
output:
  organize_by_defect: true
  save_masks: true
  save_metadata: true
paths:
