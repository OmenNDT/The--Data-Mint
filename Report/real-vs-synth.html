<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nền tảng phân tích ảnh 4 tầng</title>
<style>/* Dark Neumorphism - khối nổi mềm, ánh sáng ven, phân cấp thị giác trầm, ít chói.
   Bố cục: cả 4 tầng nằm gọn trong một khung màn hình, không cuộn dọc. */
:root{
  --bg:#0a0a0e; --bg2:#0e0e15; --surf:#13131c; --surf2:#171722;
  --sh-dark:#05050a; --sh-lite:#20202c;
  --txt:#e6e6f0; --dim:#8b8ba3; --dim2:#5e5e75;
  --a1:#5ec8bd; --a2:#d9a441; --a3:#8b7fd4; --a4:#d4756b; --a5:#6f9fd8;
  --r:14px; --rs:10px;
  --font:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
  --mono:'JetBrains Mono','Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;
  background:radial-gradient(1100px 620px at 50% -12%,#14141e 0%,var(--bg) 62%);
  color:var(--txt);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:flex;flex-direction:column;gap:9px;padding:10px 14px 12px;max-width:2100px;margin:0 auto}

/* --- thanh tiêu đề mỏng --- */
.masthead{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:9px 16px;border-radius:var(--r);
  position:relative;overflow:hidden;background:linear-gradient(145deg,var(--surf2),var(--bg2));
  box-shadow:7px 7px 18px var(--sh-dark),-7px -7px 18px var(--sh-lite);
  border-top:1px solid rgba(255,255,255,.06)}
.masthead::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,rgba(255,255,255,.16),transparent 55%)}
.masthead h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.masthead p{margin:0;color:var(--dim);font-size:11.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;color:var(--dim);padding:4px 10px;border-radius:999px;background:var(--bg2);white-space:nowrap;
  box-shadow:inset 3px 3px 6px var(--sh-dark),inset -3px -3px 6px var(--sh-lite)}

/* --- vỏ mỗi tầng --- */
.layer{position:relative;border-radius:var(--r);padding:10px 14px 12px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--surf),var(--bg2));
  box-shadow:8px 8px 20px var(--sh-dark),-8px -8px 20px var(--sh-lite);
  border-top:1px solid rgba(255,255,255,.05)}
.layer::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,.14),transparent 50%)}
.layer.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* Tầng 1-3: nhãn tầng nằm dọc bên trái, nội dung trải hết bề ngang - tiết kiệm chiều cao. */
.layer.row{display:flex;align-items:center;gap:13px}
.layer.row .cards,.layer.row .data-row{flex:1 1 auto;min-width:0}
.layer-head.col{flex:0 0 122px;flex-direction:column;align-items:flex-start;gap:5px;margin:0;overflow:visible}
.layer-head{display:flex;align-items:baseline;gap:11px;margin-bottom:8px;flex-wrap:nowrap;overflow:hidden}
.layer-no{font:600 10px/1 var(--mono);letter-spacing:1.3px;color:var(--dim2);padding:6px 9px;border-radius:8px;
  background:var(--bg2);box-shadow:inset 3px 3px 6px var(--sh-dark),inset -3px -3px 6px var(--sh-lite);white-space:nowrap}
.layer-title{font-size:14px;font-weight:620;white-space:nowrap}
.layer-sub{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- thẻ chọn thuật toán: số cột tự co theo số thuật toán được mở khóa --- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.card{cursor:pointer;border-radius:var(--rs);padding:9px 11px;text-align:left;color:var(--dim);
  background:linear-gradient(145deg,var(--surf2),var(--bg2));border:0;font-family:inherit;min-width:0;
  box-shadow:5px 5px 13px var(--sh-dark),-5px -5px 13px var(--sh-lite);
  border-top:1px solid rgba(255,255,255,.045);transition:.16s ease}
.card:hover{color:var(--txt)}
.card .ct{display:block;font-size:12px;font-weight:600;line-height:1.25;margin-bottom:2px;color:inherit}
.card .cb{display:block;font-size:10px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on{color:var(--txt);
  box-shadow:inset 5px 5px 11px var(--sh-dark),inset -5px -5px 11px var(--sh-lite),0 0 0 1px rgba(94,200,189,.2)}
.card.on .ct{color:var(--a1)}
.card.on.stat .ct{color:var(--a2)}
.card.on .cb{color:var(--dim)}

/* --- tầng dữ liệu: một hàng ngang --- */
.data-row{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;overflow:hidden}
.ds-row{display:flex;gap:7px;flex:0 0 auto}
.ds{cursor:pointer;border:0;font-family:inherit;color:var(--dim);padding:7px 12px;border-radius:9px;font-size:12px;
  background:linear-gradient(145deg,var(--surf2),var(--bg2));white-space:nowrap;
  box-shadow:4px 4px 11px var(--sh-dark),-4px -4px 11px var(--sh-lite);
  border-top:1px solid rgba(255,255,255,.045);transition:.16s}
.ds b{font-weight:640;display:block;font-size:12.5px}
.ds small{font-size:9.5px;color:var(--dim2);display:block}
.ds:hover{color:var(--txt)}
.ds.on{color:var(--a5);box-shadow:inset 4px 4px 9px var(--sh-dark),inset -4px -4px 9px var(--sh-lite)}
.ds.on small{color:var(--dim)}
/* Hẹp quá thì bốn chỉ số xuống thành hai hàng, không cắt cụt giá trị. */
.kpis{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto;min-width:0}
.kpi{border-radius:9px;padding:6px 10px;background:var(--bg2);min-width:98px;flex:1 1 98px;
  box-shadow:inset 3px 3px 8px var(--sh-dark),inset -3px -3px 8px var(--sh-lite)}
.kpi .kk{font-size:9.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kvv{font:600 12.5px/1.35 var(--mono);color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:0 0 auto;width:150px}
/* Bề ngang hẹp dần: siết nhãn, rồi bỏ biểu đồ thu nhỏ (nội dung này đã có trong lớp phủ)
   để bốn chỉ số và ba nút vẫn đủ chỗ hiện trọn chữ. */
@media (max-width:1560px){.mini{width:120px}.layer-head.col{flex-basis:98px}.more{min-width:84px;padding:9px 8px}}
@media (max-width:1440px){
  .mini{display:none}
  .more{min-width:78px;padding:9px 6px;font-size:10.5px}
  .ds{padding:6px 9px}
  .ds b{font-size:12px}
  .ds small{font-size:9px}
}
/* Ba nút nằm ngang, chia đều bề ngang nhóm để trông cân. */
.more-group{display:flex;gap:6px;flex:0 0 auto}
.more{cursor:pointer;border:0;font-family:inherit;color:var(--dim);font-size:11px;padding:9px 12px;border-radius:9px;
  background:linear-gradient(145deg,var(--surf2),var(--bg2));white-space:nowrap;text-align:center;
  flex:1 1 0;min-width:92px;
  box-shadow:4px 4px 10px var(--sh-dark),-4px -4px 10px var(--sh-lite);border-top:1px solid rgba(255,255,255,.045)}
.more:hover{color:var(--a5)}

/* --- lớp phủ xem dữ liệu thô --- */
.sheet{position:fixed;inset:0;background:rgba(5,5,10,.72);display:none;align-items:center;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet-in{width:min(1180px,94vw);max-height:88vh;display:flex;flex-direction:column;border-radius:var(--r);
  background:linear-gradient(145deg,var(--surf2),var(--bg2));overflow:hidden;
  box-shadow:12px 12px 32px var(--sh-dark),-12px -12px 32px var(--sh-lite);border-top:1px solid rgba(255,255,255,.07)}
.sheet-tabs{display:flex;gap:8px;padding:12px 22px 0;flex:0 0 auto}
.sheet-tabs button{cursor:pointer;border:0;font-family:inherit;font-size:12px;color:var(--dim);padding:8px 16px;
  border-radius:9px 9px 0 0;background:transparent;transition:.15s}
.sheet-tabs button:hover{color:var(--txt)}
.sheet-tabs button.on{color:var(--a1);background:var(--bg2);
  box-shadow:inset 3px 3px 8px var(--sh-dark),inset -3px -3px 8px var(--sh-lite)}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 22px 20px}
.sheet-in h4{margin:0 0 9px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim2);font-weight:600}
.sheet-in h4:not(:first-child){margin-top:18px}
table.raw{width:100%;border-collapse:collapse;font:11px/1.5 var(--mono);color:var(--dim)}
table.raw th{color:var(--dim2);font-weight:600;text-align:right;padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.055)}
table.raw td{text-align:right;padding:2px 6px;color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:10.5px/1 var(--mono);color:var(--dim);padding:5px 8px;border-radius:7px;background:var(--surf2);
  box-shadow:2px 2px 5px var(--sh-dark),-2px -2px 5px var(--sh-lite)}
.chip.off{color:var(--dim2);opacity:.5}
.sheet-note{font-size:11.5px;color:var(--dim2);margin:9px 0 0}

/* --- nội dung cửa sổ khám phá dữ liệu --- */
.xp-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.xp-head h2{margin:0;font-size:17px;font-weight:650}
.xp-close{font-size:11px;color:var(--dim2)}
.xp-intro{margin:0 0 16px;font-size:12.5px;color:var(--dim);line-height:1.6}
.xp-intro code{font:11.5px var(--mono);color:var(--a5)}
.xp-sec{display:flex;gap:14px;padding:15px 0;border-top:1px solid rgba(255,255,255,.05)}
.xp-no{flex:0 0 62px;font:600 10px/1 var(--mono);letter-spacing:1.2px;color:var(--dim2);height:fit-content;
  padding:8px 0;text-align:center;border-radius:8px;background:var(--bg2);
  box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-lite)}
.xp-body{flex:1 1 auto;min-width:0}
.xp-body h3{margin:0 0 5px;font-size:14.5px;font-weight:640;color:var(--a1)}
.xp-body h5{margin:14px 0 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2);font-weight:600}
.xp-lead{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.6;font-style:italic;
  padding-left:11px;border-left:2px solid rgba(255,255,255,.08)}
.xp-fact{margin:9px 0;font-size:12.5px;line-height:1.65;color:var(--txt)}
.xp-fact b{color:var(--a2);font-weight:600}
.xp-note{margin:7px 0 0;font-size:11.5px;color:var(--dim2);line-height:1.55}
.xp-note b{color:var(--dim);font-weight:600}
.xp-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:10px}
.xp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.xp-cell{border-radius:9px;padding:6px 10px;background:var(--bg2);
  box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-lite)}
.xp-cell .kk{font-size:9.5px;color:var(--dim2)}
.xp-cell .kvv{font:600 12.5px/1.35 var(--mono);color:var(--txt)}
table.xp-tb{width:100%;border-collapse:collapse;font:11px/1.6 var(--mono);color:var(--txt);margin-top:6px}
table.xp-tb th{color:var(--dim2);font-weight:600;text-align:right;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
table.xp-tb td{text-align:right;padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.025)}
table.xp-tb .l{text-align:left}
table.xp-tb tr.dim td{color:var(--dim2);opacity:.55}
table.xp-tb i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.bar{display:inline-block;width:52px;height:6px;border-radius:3px;background:rgba(255,255,255,.06);margin-right:7px;vertical-align:middle}
.bar b{display:block;height:100%;border-radius:3px}
.xp-raw{margin:4px 0 0 76px}
.xp-trigger{cursor:pointer}
.xp-trigger:hover .layer-no{color:var(--a5)}
@media(max-width:900px){.xp-two{grid-template-columns:1fr}.xp-sec{flex-direction:column;gap:8px}.xp-raw{margin-left:0}}

/* --- cửa sổ thuật toán --- */
.ag-grp{margin:18px 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--a2);font-weight:600}
.ag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.ag-card{border-radius:var(--rs);padding:13px 15px;background:var(--bg2);
  box-shadow:inset 4px 4px 10px var(--sh-dark),inset -4px -4px 10px var(--sh-lite)}
.ag-card h4{margin:0 0 5px;font-size:13.5px;font-weight:640;color:var(--txt)}
.ag-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.ag-tags span{font-size:10px;color:var(--dim2);padding:3px 8px;border-radius:999px;background:var(--surf2)}
.ag-tags .cx{font-family:var(--mono);color:var(--a5)}
svg.sk{width:100%;height:auto;max-width:280px;margin:2px auto 8px;display:block}
.ag-prob,.ag-sol,.ag-an{margin:6px 0;font-size:12px;line-height:1.6;color:var(--dim)}
.ag-prob b,.ag-sol b,.ag-an b{color:var(--txt);font-weight:600}
.ag-prob{padding-left:9px;border-left:2px solid rgba(212,117,107,.42)}
.ag-prob b{color:var(--a4)}
.ag-sol{padding-left:9px;border-left:2px solid rgba(94,200,189,.42)}
.ag-sol b{color:var(--a1)}
.ag-an{color:var(--a1);opacity:.92}
.ag-an b{color:var(--a1)}
.ag-term{margin:-6px 0 14px;font-size:12px;line-height:1.6;color:var(--dim);border-radius:var(--rs);
  padding:10px 14px;background:var(--bg2);border-left:2px solid var(--a5);
  box-shadow:inset 3px 3px 8px var(--sh-dark),inset -3px -3px 8px var(--sh-lite)}
.ag-term b{color:var(--txt)}
.ag-term em{color:var(--a5);font-style:normal;font-weight:600}
.ag-app{margin-top:9px;border-radius:9px;padding:8px 11px;background:var(--surf2);
  box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-lite)}
.ag-app h6{margin:0 0 5px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--a2);font-weight:600}
.ag-app dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:11.5px;line-height:1.5}
.ag-app dt{color:var(--dim2);white-space:nowrap}
.ag-app dd{margin:0;color:var(--dim)}
.ag-why,.ag-alt{margin:8px 0 0;font-size:11.5px;line-height:1.55;color:var(--dim);
  padding-left:9px;border-left:2px solid rgba(139,127,212,.45)}
.ag-why b{color:var(--a3);font-weight:600}
.ag-alt{border-left-color:rgba(212,117,107,.45)}
.ag-alt b{color:var(--a4);font-weight:600}
.ag-pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:9px}
.ag-pc h6{margin:0 0 4px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2);font-weight:600}
.ag-pc ul{margin:0;padding-left:15px;font-size:11.5px;line-height:1.5;color:var(--dim)}
.ag-pc ul li{margin-bottom:3px}
.ag-pc ul li::marker{color:var(--a1)}
.ag-pc ul.bad li::marker{color:var(--a4)}

/* bảng tổng hợp phương án thay thế */
table.sw-tb{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
table.sw-tb td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
table.sw-tb .l{text-align:left}
table.sw-tb .nm{width:238px;color:var(--txt);font-weight:600}
table.sw-tb tr.grp td{color:var(--a2);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  font-weight:600;padding-top:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sw-legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sw{display:inline-block;margin:0 6px 5px 0;padding:4px 9px;border-radius:7px;font-size:11px;color:var(--dim);
  background:var(--surf2);box-shadow:2px 2px 6px var(--sh-dark),-2px -2px 6px var(--sh-lite)}
.sw i{font-style:normal;font-size:9.5px;opacity:.75;margin-left:6px}
.sw-ap{color:var(--a1);box-shadow:inset 2px 2px 5px var(--sh-dark),inset -2px -2px 5px var(--sh-lite)}
.sw-bt{color:var(--a2)}
.sw-tt{color:var(--a5)}
.sw-bc{color:var(--dim)}
.sw-km{color:var(--dim2);opacity:.72}

/* --- cửa sổ khái niệm --- */
.cc-sec{padding:16px 0;border-top:1px solid rgba(255,255,255,.05)}
.cc-sec h3{margin:0 0 10px;font-size:14.5px;font-weight:640;color:var(--a1)}
.cc-sec code{font:11.5px var(--mono);color:var(--a5)}
.cc-sec u{text-decoration-color:var(--a4);text-underline-offset:3px}

/* --- tầng biểu đồ: chiếm hết chiều cao còn lại --- */
.viz-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:11px;flex:1 1 auto;min-height:0}
.panel{border-radius:var(--rs);padding:10px 12px;background:var(--bg2);min-width:0;min-height:0;
  display:flex;flex-direction:column;
  box-shadow:inset 4px 4px 10px var(--sh-dark),inset -4px -4px 10px var(--sh-lite)}
.panel h3{margin:0;font-size:12.5px;font-weight:620;color:var(--txt)}
.panel .ph{margin:2px 0 6px;font-size:10.5px;color:var(--dim2);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plot{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px}
svg{display:block;width:100%;height:100%;flex:1 1 0;min-height:0}
.metrics{display:grid;gap:8px;margin-top:9px;flex:0 0 auto}
.metric{border-radius:9px;padding:6px 10px;min-width:0;background:linear-gradient(145deg,var(--surf2),var(--bg2));
  box-shadow:4px 4px 10px var(--sh-dark),-4px -4px 10px var(--sh-lite);border-top:1px solid rgba(255,255,255,.04)}
.metric .mk{font-size:9.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .mv{font:600 12.5px/1.35 var(--mono);color:var(--a1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{margin-top:8px;border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--txt);flex:0 0 auto;
  display:flex;align-items:baseline;gap:11px;
  background:var(--bg2);box-shadow:inset 4px 4px 9px var(--sh-dark),inset -4px -4px 9px var(--sh-lite);
  border-left:2px solid var(--a2)}
.verdict span{color:var(--dim2);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
.verdict b{font-weight:400;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pipe{font:10.5px/1.5 var(--mono);color:var(--dim2);margin-top:6px;flex:0 0 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe em{color:var(--a1);font-style:normal}
.pipe i{color:var(--a2);font-style:normal}

/* --- chú giải và chữ trong svg --- */
.lg{display:flex;flex-direction:row;gap:11px;flex-wrap:wrap;font-size:10px;color:var(--dim);flex:0 0 auto;line-height:1.3}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
text{font-family:var(--font);fill:var(--dim)}
.ax{stroke:rgba(255,255,255,.07)}
.axt{font-size:9.5px;fill:var(--dim2)}
.axl{font-size:10.5px;fill:var(--dim)}

/* Màn hình thấp hoặc hẹp: trả lại cuộn dọc để không bóp nát nội dung. */
/* Màn hình thấp: cắt bớt phần chữ phụ để nhường chiều cao cho biểu đồ. */
@media (max-height:870px){
  .wrap{gap:7px;padding:8px 12px 10px}
  .layer{padding:8px 12px 9px}
  .masthead p{display:none}
  .panel .ph{-webkit-line-clamp:1;margin-bottom:4px}
  .pipe{display:none}
  .card{padding:7px 9px}
  .metric{padding:5px 9px}
  .verdict{padding:6px 11px}
}
@media (max-height:620px),(max-width:1080px){
  body{overflow:auto}
  .wrap{height:auto;min-height:100%}
  .layer.grow{flex:0 0 auto}
  .viz-grid{min-height:520px}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .data-row{flex-wrap:wrap}
}
@media (max-width:820px){.viz-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* --- dải ảnh thu nhỏ, riêng cho báo cáo dữ liệu ảnh --- */
.tg{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.tg figure{margin:0;width:74px}
.tg img{width:74px;height:74px;object-fit:cover;border-radius:7px;display:block;
  box-shadow:3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-lite)}
.tg figcaption{font:9.5px/1.35 var(--mono);color:var(--dim2);margin-top:4px;word-break:break-all}
.tp{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.tp .pr{display:flex;gap:3px;padding:6px;border-radius:9px;background:var(--bg2);
  box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-lite)}
.tp .pr img{width:56px;height:56px;object-fit:cover;border-radius:5px;display:block}
.tp .pr .cap{font:9.5px/1.3 var(--mono);color:var(--dim2);align-self:center;max-width:96px}
.tp .pr.warn{box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-lite),0 0 0 1px rgba(214,120,120,.45)}

/* SVG trong cửa sổ tra cứu nằm trong khối cuộn cao tự động, nên phải hủy quy tắc height:100%
   vốn chỉ đúng với khung biểu đồ ở tầng 4. Không hủy thì chiều cao quy về 0 và hình biến mất. */
.sheet-scroll svg{height:auto;flex:none;width:100%;max-width:620px;margin:6px 0}
</style>

  <div class="layer grow">

netration"}},"caps":{"pixels":true,"groups":true,"order":false,"labels":true,"exif":false,"masks":false,"binary":false,"splits":true},"capNames":{"pixels":"điểm ảnh","labels":"nhãn lớp","binary":"bài toán hai lớp","masks":"mặt nạ khuyết tật","groups":"lô thu nhận","splits":"tập chia","order":"trật tự thu nhận","exif":"siêu dữ liệu EXIF"},"discrete":[{"id":"knn","title":"Đồ thị k lân cận giữa các ảnh","branch":"Lý thuyết đồ thị","desc":"Mỗi ảnh là một đỉnh, nối với 5 ảnh có hồ sơ đặc trưng gần nhất. Bậc đỉnh cho biết ảnh nằm giữa một cụm dày các ảnh tương tự hay đứng một mình ở rìa tập."},{"id":"mst","title":"Cây khung nhỏ nhất Kruskal","branch":"Cây và đồ thị có trọng số","desc":"Khoảng cách giữa hai đặc trưng lấy bằng 1 − |tương quan|. Kruskal giữ đúng n − 1 cạnh nhẹ nhất, lộ ra xương sống quan hệ và chỉ thẳng những đặc trưng dư thừa."},{"id":"phash","title":"Băm tri giác + cụm bán kính Hamming","branch":"Không gian mét rời rạc","desc":"Mỗi ảnh rút về một mã 64 bit bắt hình dạng chứ không bắt điểm ảnh. Union-find gom các ảnh nối được với nhau trong bán kính Hamming thành cụm trùng lặp bắc cầu."},{"id":"quad","title":"Cây tứ phân theo phương sai ô","branch":"Phân hoạch không gian đệ quy","desc":"Chia ảnh làm bốn, chỉ chia tiếp ô nào còn biến thiên mạnh. Cây dừng sớm ở vùng phẳng và đi sâu ở vùng nhiều chi tiết, nên số lá đo được độ phức tạp cấu trúc."},{"id":"lbp","title":"Mã nhị phân cục bộ + lớp tương đương","branch":"Mã vòng và lớp tương đương","desc":"Mỗi điểm ảnh thành một từ 8 bit khi so với tám lân cận. 256 từ chia thành lớp tương đương theo số lần đổi trạng thái quanh vòng; lớp uniform ứng với cạnh, góc và điểm."},{"id":"cc","title":"Thành phần liên thông union-find","branch":"Liên thông trên lưới điểm ảnh","desc":"Quét hai lượt trên mặt nạ nhị phân, hợp nhất nhãn bằng union-find. Mỗi thành phần là một vùng bất thường rời rạc, đo được diện tích, hộp bao và trọng tâm."},{"id":"part","title":"Phân hoạch lớp tương đương","branch":"Lý thuyết tập hợp","desc":"Chia tập ảnh thành các khối rời nhau, phủ kín, theo nhãn lớp. Mỗi khối có hồ sơ đặc trưng riêng đã chuẩn hóa, dùng làm cơ sở so sánh công bằng giữa các lớp."},{"id":"bipart","title":"Đồ thị hai phía lớp ↔ lô","branch":"Đồ thị hai phía","desc":"Cạnh nối một lớp với một lô khi có ảnh thuộc cả hai. Đồ thị thưa nghĩa là hai trục dính nhau: mô hình sẽ học đặc điểm của lô thay vì học đặc điểm của lớp."}],"stats":[{"id":"shift","title":"Dịch chuyển phân phối","branch":"KS + Jensen-Shannon + Wasserstein","desc":"Kiểm định hai mẫu có cùng phân phối hay không, thay vì chỉ so trung bình. Một lô chụp lệch sáng có thể giữ nguyên trung bình mà đuôi phân phối đã dịch hẳn."},{"id":"sep","title":"Khả tách hai nhóm","branch":"AUC-ROC + hệ số bóng + tỉ số Fisher","desc":"Lấy ngẫu nhiên một ảnh mỗi nhóm, xác suất đại lượng này xếp đúng thứ tự là bao nhiêu. 0,5 là tung đồng xu, 1,0 là tách hoàn toàn bằng đúng một chiều."},{"id":"reg","title":"Hồi quy tuyến tính","branch":"OLS + dải tin cậy 95%","desc":"Bình phương nhỏ nhất trên cặp điểm mà cấu trúc rời rạc sinh ra, kèm dải tin cậy 95% của đường hồi quy và đồ thị phần dư để soi giả định tuyến tính."},{"id":"corr","title":"Phân tích tương quan","branch":"Pearson + Spearman","desc":"Pearson đo quan hệ tuyến tính, Spearman đo quan hệ đơn điệu theo hạng. Chênh lệch giữa hai hệ số tiết lộ dạng phi tuyến mà một mình Pearson bỏ sót."},{"id":"drift","title":"Điểm đổi theo trật tự thu nhận","branch":"CUSUM + phân đoạn nhị phân","desc":"Ảnh công nghiệp luôn thu theo đợt: đổi ca, đổi đèn, lau ống kính. Mỗi lần như vậy phân bố dịch một nấc, và điểm đổi tìm được thường trùng một sự kiện có thật."},{"id":"boot","title":"Bootstrap BCa","branch":"Lấy lại mẫu 4.000 lần","desc":"Đặc trưng ảnh hầu như không phân phối chuẩn: độ sắc nét lệch phải nặng, tỉ lệ điểm cháy trắng dồn ở 0. Lấy lại mẫu tránh được giả định sai ngay từ đầu."},{"id":"imb","title":"Mất cân bằng nhóm","branch":"Wilson + entropy + Gini","desc":"Khoảng tin cậy Wilson cho tỉ lệ từng nhóm, entr <script>/* Bộ vẽ SVG nền: thang đo, trục, và các hình cơ bản dùng lại cho mọi biểu đồ.
   Không dùng thư viện ngoài - trang chạy được khi mở trực tiếp từ đĩa, không cần mạng. */
const PAD = { l: 52, r: 16, t: 16, b: 38 };

/* Định dạng số theo quy ước tiếng Việt: dấu phẩy thập phân, dấu chấm phần nghìn. */
function fmt(v, n) {
  if (v === null || v === undefined || !isFinite(v)) return '–';
  if (n === undefined) n = Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 1 ? 2 : 3;
  let s = Math.abs(v).toFixed(n);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');   // chỉ cắt số 0 sau dấu thập phân
  const [a, b] = s.split('.');
  return (v < 0 ? '−' : '') + a.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (b ? ',' + b : '');
}
/* Thoát cả dấu nháy: chuỗi từ dữ liệu được nội suy vào cả nội dung lẫn thuộc tính HTML
   (data-ds="...", title="..."), nên bỏ sót nháy là vỡ thẻ. */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const extent = a => { let lo = Infinity, hi = -Infinity; for (const v of a) { if (v < lo) lo = v; if (v > hi) hi = v; } return [lo, hi]; };

/* Nới biên miền giá trị để điểm dữ liệu không dính sát mép. */
function padExtent(a, f) {
  let [lo, hi] = extent(a); const d = (hi - lo) || Math.abs(hi) || 1;
  return [lo - d * (f || 0.06), hi + d * (f || 0.06)];
}
const scale = (d0, d1, r0, r1) => { const k = (r1 - r0) / ((d1 - d0) || 1); return v => r0 + (v - d0) * k; };

/* Mốc trục "đẹp": bước 1 / 2 / 5 nhân lũy thừa 10. */
function ticks(lo, hi, n) {
  const raw = (hi - lo) / (n || 5), mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const norm = raw / mag, step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* Khung vẽ chuẩn: trả về hàm chiếu x, y và phần SVG của hai trục. */
function frame(W, H, xd, yd, xl, yl, opt) {
  opt = opt || {};
  const x = scale(xd[0], xd[1], PAD.l, W - PAD.r), y = scale(yd[0], yd[1], H - PAD.b, PAD.t);
  let g = `<line class="ax" x1="${PAD.l}" y1="${H - PAD.b}" x2="${W - PAD.r}" y2="${H - PAD.b}"/>` +
          `<line class="ax" x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${H - PAD.b}"/>`;
  for (const t of ticks(xd[0], xd[1], opt.xn || 6)) {
    const px = x(t); if (px < PAD.l - 1 || px > W - PAD.r + 1) continue;
    g += `<line class="ax" x1="${px}" y1="${PAD.t}" x2="${px}" y2="${H - PAD.b}" opacity=".45"/>` +
         `<text class="axt" x="${px}" y="${H - PAD.b + 14}" text-anchor="middle">${fmt(t)}</text>`;
  }
  for (const t of ticks(yd[0], yd[1], opt.yn || 5)) {
    const py = y(t); if (py < PAD.t - 1 || py > H - PAD.b + 1) continue;
    g += `<line class="ax" x1="${PAD.l}" y1="${py}" x2="${W - PAD.r}" y2="${py}" opacity=".45"/>` +
         `<text class="axt" x="${PAD.l - 7}" y="${py + 3}" text-anchor="end">${fmt(t)}</text>`;
  }
  if (xl) g += `<text class="axl" x="${(PAD.l + W - PAD.r) / 2}" y="${H - 4}" text-anchor="middle">${esc(xl)}</text>`;
  if (yl) g += `<text class="axl" transform="translate(12,${(PAD.t + H - PAD.b) / 2}) rotate(-90)" text-anchor="middle">${esc(yl)}</text>`;
  return { x, y, g };
}

const svg = (W, H, inner) => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const line = (pts, color, w, dash) =>
  `<path d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}" fill="none" stroke="${color}" stroke-width="${w || 1.6}"${dash ? ` stroke-dasharray="${dash}"` : ''} stroke-linejoin="round"/>`;
const area = (top, bot, color, op) =>
  `<path d="M${top.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}L${bot.slice().reverse().map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}Z" fill="${color}" opacity="${op || .14}"/>`;

/* Cột biểu đồ tần suất, dựng từ cặp (đếm, cạnh ô). */
function histBars(h, x, y, y0, color, op) {
  let g = '';
  for (let i = 0; i < h.counts.length; i++) {
    const a = x(h.edges[i]), b = x(h.edges[i + 1]), t = y(h.counts[i]);
    g += `<rect x="${a.toFixed(1)}" y="${t.toFixed(1)}" width="${Math.max(b - a - .6, .6).toFixed(1)}" height="${Math.max(y0 - t, 0).toFixed(1)}" fill="${color}" opacity="${op || .5}" rx="1.5"/>`;
  }
  return g;
}

/* Hộp và râu (box plot) nằm ngang. */
function boxH(b, x, cy, h, color) {
  const q1 = x(b.q1), q3 = x(b.q3), md = x(b.med);
  return `<line x1="${x(b.lo)}" y1="${cy}" x2="${x(b.hi)}" y2="${cy}" stroke="${color}" stroke-width="1.2" opacity=".65"/>` +
    `<rect x="${q1}" y="${cy - h / 2}" width="${Math.max(q3 - q1, 1)}" height="${h}" fill="${color}" opacity=".26" rx="3"/>` +
    `<line x1="${md}" y1="${cy - h / 2}" x2="${md}" y2="${cy + h / 2}" stroke="${color}" stroke-width="2.2"/>` +
    b.out.map(o => `<circle cx="${x(o)}" cy="${cy}" r="1.9" fill="${color}" opacity=".5"/>`).join('');
}

/* Bản đồ nhiệt cho ma trận vuông, thang màu lạnh - ấm quanh giá trị 0.
   Trả về một nhóm <g> để nhúng vào khung SVG chung, nhờ vậy khớp đúng chiều cao khung. */
function heatmapG(m, labels, ox, oy, w, h, title) {
  const n = m.length, left = Math.min(92, w * 0.24), top = Math.min(58, h * 0.26);
  const cell = Math.max(Math.min((w - left - 8) / n, (h - top - 8) / n), 4);
  let lim = 0; for (const r of m) for (const v of r) if (isFinite(v)) lim = Math.max(lim, Math.abs(v));
  lim = lim || 1;
  const col = v => { const t = Math.max(-1, Math.min(1, v / lim));
    return t >= 0 ? `rgba(94,200,189,${(.12 + .8 * t).toFixed(3)})` : `rgba(212,117,107,${(.12 + .8 * -t).toFixed(3)})`; };
  const shift = Math.max((w - left - n * cell) / 2, 0);   // căn giữa khi ma trận nhỏ hơn khung
  let g = `<text class="axl" x="${left + shift}" y="10">${esc(title || '')}</text>`;
  const short = s => String(s).length > 13 ? String(s).slice(0, 12) + '…' : s;
  for (let i = 0; i < n; i++) {
    g += `<text class="axt" x="${left + shift - 6}" y="${top + i * cell + cell / 2 + 3}" text-anchor="end">${esc(short(labels[i]))}</text>`;
    g += `<text class="axt" transform="translate(${left + shift + i * cell + cell / 2},${top - 5}) rotate(-52)" text-anchor="start">${esc(short(labels[i]))}</text>`;
    for (let j = 0; j < n; j++)
      g += `<rect x="${left + shift + j * cell}" y="${top + i * cell}" width="${cell - 1.2}" height="${cell - 1.2}" rx="2" fill="${col(m[i][j])}"><title>${esc(labels[i])} ↔ ${esc(labels[j])}: ${fmt(m[i][j], 3)}</title></rect>`;
  }
  return `<g transform="translate(${ox},${oy})">${g}</g>`;
}

const legend = items => `<div class="lg">${items.map(i => `<span><i style="background:${i[1]}"></i>${esc(i[0])}</span>`).join('')}</div>`;

/* Chín bộ vẽ cho TẦNG CẤU TRÚC RỜI RẠC của báo cáo bộ ảnh: mỗi hàm nhận payload Python đã
   tính sẵn và chỉ lo phần vẽ. Không có bundler, không thư viện ngoài, trang mở thẳng từ đĩa
   nên mọi hàm phải tự chịu được dữ liệu rỗng/thiếu mà không sinh ra NaN hay undefined. */
/* Đơn vị: Python đã trả uniformShare và share theo thang phần trăm 0-100. Nhân thêm 100 ở đây
   là lỗi cũ từng làm nhãn ghi "phủ 5.914%". */
/* Bảng màu rời rạc dùng chung cho lớp/nhãn; lặp vòng khi số lớp vượt độ dài bảng. */
const PALETTE = ['#5ec8bd', '#d9a441', '#d4756b', '#9fbf6a', '#7aa6d9', '#b98ad9', '#d98b52', '#8b8ba3'];
const palette = i => PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length];
/* Thang màu trầm liên tục (xanh lạnh → hổ phách), dùng cho phương sai/giá trị chuẩn hoá 0..1. */
function seqColor(t) {
  t = Math.max(0, Math.min(1, isFinite(t) ? t : 0));
  const a = [94, 200, 189], b = [217, 164, 65];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
}
const safeArr = a => Array.isArray(a) ? a : [];
/* Khung trống kèm lời giải thích, dùng khi payload không có gì để vẽ. */
function emptyMsg(W, H, msg) {
  return svg(W, H, `<rect x="8" y="8" width="${W - 16}" height="${H - 16}" rx="10" fill="none" stroke="#8b8ba3" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>` +
    `<text class="axl" x="${W / 2}" y="${H / 2}" text-anchor="middle">${esc(msg)}</text>`);
}
/* Đồ thị k lân cận gần nhất, tô màu theo lớp thay vì theo tuổi thọ như bản gốc. */
function graph(v, W, H) {
  const nodes = safeArr(v.nodes), edges = safeArr(v.edges);
  if (!nodes.length) return emptyMsg(W, H, 'Không có điểm dữ liệu để vẽ đồ thị.');
  const mx = W * 0.055, my = H * 0.08, top = H * 0.11;
  const X = n => mx + (n.x || 0) * (W - 2 * mx), Y = n => H - my - (n.y || 0) * (H - my - top);
  const rk = Math.max(Math.min(W, H) / 430, .55);
  let g = edges.map(e => {
    const a = nodes[e[0]], b = nodes[e[1]]; if (!a || !b) return '';
    return `<line x1="${X(a).toFixed(1)}" y1="${Y(a).toFixed(1)}" x2="${X(b).toFixed(1)}" y2="${Y(b).toFixed(1)}" stroke="#8b8ba3" stroke-width=".7" opacity=".26"/>`;
  }).join('');
  g += nodes.map((n, i) => {
    const r = (3.2 + (n.deg || 0) * .85) * rk, col = (n.cls != null && n.cls >= 0) ? palette(n.cls) : '#6b6b80';
    return `<circle cx="${X(n).toFixed(1)}" cy="${Y(n).toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" opacity="${i === v.hub ? .98 : .8}" stroke="${i === v.hub ? '#e6e6f0' : 'none'}" stroke-width="${i === v.hub ? 1.4 : 0}"><title>Điểm #${esc(n.id)} · bậc ${fmt(n.deg || 0, 0)}</title></circle>`;
  }).join('');
  g += `<text class="axl" x="${mx.toFixed(1)}" y="${(top - 8).toFixed(1)}">Toạ độ = 2 thành phần chính · k = ${fmt(v.k || 0, 0)}</text>`;
  const names = safeArr(v.clsNames);
  const lg = names.length ? names.map((nm, i) => [nm, palette(i)]) : [['Không nhãn lớp', '#6b6b80']];
  return svg(W, H, g) + legend(lg.concat([['Bán kính = bậc đỉnh', '#8b8ba3'], ['Viền sáng = đỉnh trung tâm', '#e6e6f0']]));
}
/* Cây khung nhỏ nhất; màu nút theo valLabel (đại lượng liên tục tuỳ ngữ cảnh dữ liệu). */
function tree(v, W, H) {
  const nodes = safeArr(v.nodes), edges = safeArr(v.edges);
  if (!nodes.length) return emptyMsg(W, H, 'Không có nút để vẽ cây khung.');
  const mx = W * 0.09, my = H * 0.11, top = H * 0.12;
  const X = n => mx + (n.x || 0) * (W - 2 * mx), Y = n => H - my - (n.y || 0) * (H - my - top);
  const rk = Math.max(Math.min(W, H) / 430, .55);
  const vals = nodes.map(n => n.val || 0), [lo, hi] = extent(vals);
  const nrm = t => (t - lo) / ((hi - lo) || 1);
  const label = v.valLabel || 'Giá trị';
  let g = edges.map(e => {
    const a = nodes[e.i], b = nodes[e.j]; if (!a || !b) return '';
    const c = Math.abs(e.corr || 0);
    return `<line x1="${X(a).toFixed(1)}" y1="${Y(a).toFixed(1)}" x2="${X(b).toFixed(1)}" y2="${Y(b).toFixed(1)}" stroke="${c > .8 ? '#5ec8bd' : '#8b8ba3'}" stroke-width="${(.8 + 3 * c).toFixed(2)}" opacity=".55"><title>d = ${fmt(e.w, 3)}</title></line>`;
  }).join('');
  g += nodes.map((n, i) => {
    const r = (4 + (n.deg || 0) * 1.7) * rk;
    return `<circle cx="${X(n).toFixed(1)}" cy="${Y(n).toFixed(1)}" r="${r.toFixed(1)}" fill="${seqColor(nrm(n.val || 0))}" stroke="${i === v.hub ? '#e6e6f0' : 'none'}" stroke-width="${i === v.hub ? 1.5 : 0}"><title>${esc(n.label)} · ${esc(label)} ${fmt(n.val, 3)}</title></circle>` +
      `<text class="axt" x="${(X(n) + r + 4).toFixed(1)}" y="${(Y(n) + 3).toFixed(1)}">${esc(n.id)}</text>`;
  }).join('');
  g += `<text class="axl" x="${(mx - 24).toFixed(1)}" y="${(top - 8).toFixed(1)}">Giữ ${edges.length} / ${fmt(v.totalEdges || 0, 0)} cạnh ứng viên</text>`;
  return svg(W, H, g) + legend([[`${label} thấp`, seqColor(0)], [`${label} cao`, seqColor(1)],
    ['Độ dày cạnh = |tương quan|', '#5ec8bd'], ['Viền sáng = nút trung tâm', '#e6e6f0']]);
}
/* Trái: phân bố khoảng cách Hamming tới láng giềng gần nhất. Phải: các cặp nghi gần trùng. */
function hamming(v, W, H) {
  const hist = v.hist || {};
  const xR = Math.round(W * 0.56);
  let left;
  if (!safeArr(hist.counts).length) {
    left = emptyMsg(xR, H, 'Không có phân bố khoảng cách.');
  } else {
    const xd = [hist.edges[0], hist.edges[hist.edges.length - 1]], yd = [0, Math.max(...hist.counts, 1)];
    const { x, y, g: axes } = frame(xR, H, xd, yd, 'Khoảng cách Hamming', 'Số cặp');
    let g = axes + histBars(hist, x, y, y(0), '#5ec8bd', .55);
    if (isFinite(v.radius)) {
      const rx = x(v.radius);
      g += `<line x1="${rx.toFixed(1)}" y1="${PAD.t}" x2="${rx.toFixed(1)}" y2="${H - PAD.b}" stroke="#d9a441" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    }
    left = svg(xR, H, g);
  }
  const pairs = safeArr(v.pairs);
  let right;
  if (!pairs.length) {
    right = `<div style="padding:10px" class="axt">Không thấy cặp gần trùng.</div>`;
  } else {
    const rowH = Math.max(Math.min(H / pairs.length, 78), 40), th = Math.max(Math.min(rowH - 18, 56), 20);
    right = pairs.map(p => `<div style="display:flex;align-items:center;gap:8px;height:${rowH}px">` +
      `<img src="${esc(p.a)}" width="${th}" height="${th}" style="border-radius:6px;object-fit:cover">` +
      `<img src="${esc(p.b)}" width="${th}" height="${th}" style="border-radius:6px;object-fit:cover">` +
      `<span class="axt">d = ${fmt(p.d, 0)}</span></div>`).join('');
  }
  const lg = legend([['Vạch vàng = bán kính trùng lặp', '#d9a441'],
    [`Trùng tuyệt đối: ${fmt(v.exactDup || 0, 0)}`, '#5ec8bd'], [`Gần trùng: ${fmt(v.nearDup || 0, 0)}`, '#d4756b']]);
  return `<div style="width:${W}px;height:${H}px;display:flex;gap:10px">` +
    `<div style="width:${xR}px;flex-shrink:0">${left}</div><div style="flex:1;overflow:auto">${right}</div></div>` + lg;
}
/* Quadtree: ảnh gốc làm nền, chồng khung chia theo phương sai, viền mảnh dần khi vào sâu. */
function quadtree(v, W, H) {
  if (!v.img) return emptyMsg(W, H, 'Không có ảnh nền cho quadtree.');
  const rects = safeArr(v.rects);
  const mx = 8, top = 22, iw = W - 2 * mx, ih = H - top - 8;
  let g = `<text class="axl" x="${mx}" y="${(top - 8).toFixed(1)}">${esc(v.imgLabel || 'Ảnh gốc')} · ngưỡng phương sai ${fmt(v.thr, 3)}</text>` +
    `<image href="${esc(v.img)}" x="${mx}" y="${top}" width="${iw.toFixed(1)}" height="${ih.toFixed(1)}" preserveAspectRatio="none"/>`;
  g += rects.map(r => {
    const x = mx + (r.x || 0) * iw, y = top + (r.y || 0) * ih, w = (r.w || 0) * iw, h = (r.h || 0) * ih;
    const sw = Math.max(2.4 - (r.depth || 0) * .3, .5);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="none" stroke="${seqColor(r.v || 0)}" stroke-width="${sw.toFixed(2)}" opacity=".85"><title>độ sâu ${fmt(r.depth, 0)} · phương sai ${fmt(r.v, 3)}</title></rect>`;
  }).join('');
  if (!rects.length) g += `<text class="axt" x="${mx}" y="${H - 8}">Không có ô nào vượt ngưỡng chia.</text>`;
  return svg(W, H, g) + legend([['Phương sai thấp', seqColor(0)], ['Phương sai cao', seqColor(1)],
    [`${fmt(v.leaves || 0, 0)} lá · sâu tối đa ${fmt(v.maxDepth || 0, 0)}`, '#8b8ba3']]);
}
/* Biểu đồ 10 mã LBP đồng nhất (gộp theo lớp nếu có) và vài vòng bit minh hoạ. */
function lbp(v, W, H) {
  const hist = safeArr(v.hist), labels = safeArr(v.labels);
  if (!hist.length) return emptyMsg(W, H, 'Không có biểu đồ LBP.');
  const classHists = safeArr(v.classHists);
  const lw = Math.round(W * 0.6), m = { l: 40, r: 10, t: 20, b: 46 };
  const bw = (lw - m.l - m.r) / hist.length, y0 = H - m.b, barH = H - m.t - m.b;
  const maxV = Math.max(...hist, ...classHists.flatMap(c => safeArr(c.hist)), 1e-9) || 1;
  let g = `<text class="axl" x="${m.l}" y="12">Tỉ lệ mã đồng nhất · phủ ${fmt(v.uniformShare || 0, 1)}%</text>`;
  const nCls = classHists.length;
  hist.forEach((val, i) => {
    const bx = m.l + i * bw;
    if (nCls) {
      const sw = (bw - 4) / nCls;
      classHists.forEach((c, ci) => {
        const cv = safeArr(c.hist)[i] || 0, h = barH * cv / maxV;
        g += `<rect x="${(bx + 2 + ci * sw).toFixed(1)}" y="${(y0 - h).toFixed(1)}" width="${Math.max(sw - 1, .5).toFixed(1)}" height="${h.toFixed(1)}" fill="${palette(ci)}" opacity=".75"><title>${esc(c.label)}: ${fmt(cv, 3)}</title></rect>`;
      });
    } else {
      const h = barH * val / maxV;
      g += `<rect x="${(bx + 3).toFixed(1)}" y="${(y0 - h).toFixed(1)}" width="${Math.max(bw - 6, .5).toFixed(1)}" height="${h.toFixed(1)}" fill="#5ec8bd" opacity=".7"/>`;
    }
    g += `<text class="axt" transform="translate(${(bx + bw / 2).toFixed(1)},${(y0 + 12).toFixed(1)}) rotate(-40)" text-anchor="end">${esc(labels[i] != null ? labels[i] : i)}</text>`;
  });
  const codes = safeArr(v.codes).slice(0, 6);
  const rx0 = lw + 14, rw = (W - rx0 - 10) / Math.max(codes.length, 1);
  let g2 = !codes.length ? `<text class="axt" x="${rx0}" y="${H * 0.4}">Không có mã minh hoạ.</text>` :
    codes.map((c, ci) => {
      const cx = rx0 + ci * rw + rw / 2, cy = H * 0.42, R = Math.min(rw, H * 0.5) * 0.32, s = Math.max(R * .38, 3);
      const ring = safeArr(c.bits).map((b, bi) => {
        const a = -Math.PI / 2 + bi * 2 * Math.PI / 8;
        const px = cx + R * Math.cos(a) - s / 2, py = cy + R * Math.sin(a) - s / 2;
        return `<rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" fill="${b ? '#e6e6f0' : '#3a3a4a'}" stroke="#8b8ba3" stroke-width=".5"/>`;
      }).join('');
      return ring + `<text class="axt" x="${cx.toFixed(1)}" y="${(cy + R + 16).toFixed(1)}" text-anchor="middle">n = ${fmt(c.n || 0, 0)}${c.uniform ? '' : ' · lệch'}</text>`;
    }).join('');
  const lg = nCls ? classHists.map((c, i) => [c.label, palette(i)]) : [['Tần suất mã', '#5ec8bd']];
  return svg(W, H, g + `<line x1="${lw}" y1="8" x2="${lw}" y2="${H - 8}" stroke="#8b8ba3" opacity=".3"/>` + g2) + legend(lg);
}
/* Thành phần liên thông trên ảnh nhị phân/mặt nạ, kèm biểu đồ diện tích nhỏ ở góc. */
function blobs(v, W, H) {
  if (!v.img) return emptyMsg(W, H, 'Không có ảnh nền cho thành phần liên thông.');
  const comps = safeArr(v.comps);
  const mx = 8, top = 22, imW = W - 2 * mx, imH = H - top - 8;
  let g = `<text class="axl" x="${mx}" y="${(top - 8).toFixed(1)}">${fmt(v.count || 0, 0)} thành phần · nguồn: ${esc(v.source || '?')}</text>` +
    `<image href="${esc(v.img)}" x="${mx}" y="${top}" width="${imW.toFixed(1)}" height="${imH.toFixed(1)}" preserveAspectRatio="none"/>`;
  g += comps.map(c => {
    const x = mx + (c.x || 0) * imW, y = top + (c.y || 0) * imH, w = (c.w || 0) * imW, h = (c.h || 0) * imH;
    const cx = mx + (c.cx != null ? c.cx : (c.x || 0) + (c.w || 0) / 2) * imW;
    const cy = top + (c.cy != null ? c.cy : (c.y || 0) + (c.h || 0) / 2) * imH;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="none" stroke="#d9a441" stroke-width="1.2" opacity=".85"><title>diện tích ${fmt(c.area, 0)}</title></rect>` +
      `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.8" fill="#d4756b"/>`;
  }).join('');
  const hist = v.areaHist;
  let inset = '';
  if (hist && safeArr(hist.counts).length) {
    const iw = Math.min(140, W * 0.28), ih = Math.min(64, H * 0.22), ox = W - iw - 12, oy = H - ih - 10;
    const maxC = Math.max(...hist.counts, 1), bw = iw / hist.counts.length;
    inset = `<rect x="${ox}" y="${oy}" width="${iw}" height="${ih}" fill="#0e0e16" opacity=".7" rx="4"/>` +
      hist.counts.map((cnt, i) => `<rect x="${(ox + i * bw + 1).toFixed(1)}" y="${(oy + ih - ih * cnt / maxC).toFixed(1)}" width="${Math.max(bw - 2, .5).toFixed(1)}" height="${(ih * cnt / maxC).toFixed(1)}" fill="#5ec8bd" opacity=".7"/>`).join('') +
      `<text class="axt" x="${ox}" y="${oy - 3}">Diện tích thành phần</text>`;
  }
  return svg(W, H, g + inset) + legend([['Khung thành phần', '#d9a441'], ['Tâm', '#d4756b']]);
}
/* Bản đồ nhiệt hồ sơ đặc trưng từng lớp; tách riêng vì cells x featLabels không vuông
   nên không dùng lại được heatmapG (vốn giả định ma trận vuông cùng nhãn hai trục). */
function heatmapProfile(cells, feats, ox, oy, w, h) {
  const k = cells.length, ns = feats.length, gh = Math.min(24, h / k), labW = Math.min(100, w * 0.22), gw = (w - labW - 8) / ns;
  let lim = 0; cells.forEach(c => safeArr(c.profile).forEach(x => { lim = Math.max(lim, Math.abs(x || 0)); }));
  lim = lim || 1;
  let g = `<text class="axl" x="${ox.toFixed(1)}" y="${(oy - 8).toFixed(1)}">Hồ sơ đặc trưng trung bình từng lớp (chuẩn hoá theo ngưỡng chung)</text>`;
  cells.forEach((c, i) => {
    const lbl = String(c.label);
    g += `<text class="axt" x="${(ox + labW).toFixed(1)}" y="${(oy + i * gh + gh * 0.66).toFixed(1)}" text-anchor="end">${esc(lbl.length > 14 ? lbl.slice(0, 13) + '…' : lbl)}</text>`;
    safeArr(c.profile).forEach((val, j) => {
      const t = (val || 0) / lim, col = t >= 0 ? `rgba(94,200,189,${(.1 + .78 * t).toFixed(3)})` : `rgba(212,117,107,${(.1 + .78 * -t).toFixed(3)})`;
      g += `<rect x="${(ox + labW + 8 + j * gw).toFixed(1)}" y="${(oy + i * gh).toFixed(1)}" width="${Math.max(gw - 1.5, 1).toFixed(1)}" height="${(gh - 2).toFixed(1)}" rx="2" fill="${col}"><title>${esc(feats[j])} · ${esc(c.label)}: ${fmt(val, 3)}</title></rect>`;
    });
  });
  return g;
}
/* Phân hoạch tập dữ liệu thành các lớp rời nhau: cột tỉ trọng + bản đồ nhiệt hồ sơ. */
function partition(v, W, H) {
  const cells = safeArr(v.cells);
  if (!cells.length) return emptyMsg(W, H, 'Không có lớp phân hoạch.');
  const m = W * 0.08, k = cells.length, bw = (W - 2 * m) / k, barTop = H * 0.10, barMax = H * 0.26;
  const maxN = Math.max(...cells.map(c => c.n || 0), 1);
  let g = `<text class="axl" x="${m.toFixed(1)}" y="${(barTop - 12).toFixed(1)}">${fmt(v.total || 0, 0)} mẫu chia ${k} lớp rời nhau</text>`;
  cells.forEach((c, i) => {
    const h = barMax * (c.n || 0) / maxN, col = palette(i), bx = m + i * bw;
    g += `<rect x="${(bx + 6).toFixed(1)}" y="${(barTop + barMax - h).toFixed(1)}" width="${(bw - 12).toFixed(1)}" height="${h.toFixed(1)}" rx="6" fill="${col}" opacity=".32"/>` +
      `<text x="${(bx + bw / 2).toFixed(1)}" y="${(barTop + barMax - h - 5).toFixed(1)}" text-anchor="middle" font-size="11" fill="${col}">${fmt(c.share || 0, 1)}%</text>` +
      `<text class="axt" x="${(bx + bw / 2).toFixed(1)}" y="${(barTop + barMax + 14).toFixed(1)}" text-anchor="middle">${esc(String(c.label).length > 15 ? String(c.label).slice(0, 14) + '…' : c.label)}</text>`;
  });
  const feats = safeArr(v.featLabels);
  const heat = (feats.length && cells.every(c => safeArr(c.profile).length)) ? heatmapProfile(cells, feats, m, H * 0.52, W - 2 * m, H * 0.42) : '';
  return svg(W, H, g + heat) + legend(cells.map((c, i) => [c.label, palette(i)]));
}
/* Đồ thị song phân: cột trái/phải là đỉnh, cạnh cong độ dày theo trọng số; rò rỉ liệt kê dưới. */
function bipartite(v, W, H) {
  const left = safeArr(v.left), right = safeArr(v.right), edges = safeArr(v.edges);
  if (!left.length && !right.length) return emptyMsg(W, H, 'Không có dữ liệu song phân.');
  const leak = safeArr(v.leak).slice(0, 5);
  const leakH = leak.length ? Math.min(H * 0.24, leak.length * 13 + 22) : 0;
  const top = 28, bodyH = H - top - leakH - 6, xL = W * 0.14, xR = W * 0.86;
  const yPos = (arr, i) => top + (i + 0.5) * Math.max(bodyH / Math.max(arr.length, 1), 10);
  const maxW = Math.max(...edges.map(e => e.w || 0), 1e-9) || 1;
  let g = `<text class="axl" x="${xL.toFixed(1)}" y="16">${esc(v.leftTitle || 'Trái')}</text>` +
    `<text class="axl" x="${xR.toFixed(1)}" y="16" text-anchor="end">${esc(v.rightTitle || 'Phải')}</text>`;
  g += edges.map(e => {
    const a = left[e.l], b = right[e.r]; if (!a || !b) return '';
    const y1 = yPos(left, e.l), y2 = yPos(right, e.r), sw = Math.max(.6, 4 * (e.w || 0) / maxW);
    const c1 = xL + (xR - xL) * .4, c2 = xR - (xR - xL) * .4;
    return `<path d="M${xL.toFixed(1)} ${y1.toFixed(1)}C${c1.toFixed(1)} ${y1.toFixed(1)} ${c2.toFixed(1)} ${y2.toFixed(1)} ${xR.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#5ec8bd" stroke-width="${sw.toFixed(2)}" opacity=".4"><title>w = ${fmt(e.w, 3)}</title></path>`;
  }).join('');
  g += left.map((n, i) => { const y = yPos(left, i); return `<circle cx="${xL.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3 + Math.min(n.n || 0, 20) * .3).toFixed(1)}" fill="#d9a441"/><text class="axt" x="${(xL - 8).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end">${esc(n.id)}</text>`; }).join('');
  g += right.map((n, i) => { const y = yPos(right, i); return `<circle cx="${xR.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3 + Math.min(n.n || 0, 20) * .3).toFixed(1)}" fill="#d4756b"/><text class="axt" x="${(xR + 8).toFixed(1)}" y="${(y + 3).toFixed(1)}">${esc(n.id)}</text>`; }).join('');
  let lk = '';
  if (leak.length) {
    const ly = H - leakH + 6;
    lk = `<text class="axl" x="8" y="${ly.toFixed(1)}">${esc(v.leakTitle || 'Rò rỉ')}</text>` +
      leak.map((l, i) => `<text class="axt" x="8" y="${(ly + 14 + i * 13).toFixed(1)}">${esc(l.name)}: ${esc(l.a)} ↔ ${esc(l.b)}</text>`).join('');
  }
  return svg(W, H, g + lk) + legend([[v.leftTitle || 'Trái', '#d9a441'], [v.rightTitle || 'Phải', '#d4756b'], ['Độ dày cạnh = trọng số', '#5ec8bd']]);
}
/* Bản đồ nhiệt lưới rows x cols; không dùng heatmapG vì lưới không vuông và không có nhãn hai trục. */
function grid(v, W, H) {
  const rows = v.rows || 0, cols = v.cols || 0, m = safeArr(v.m);
  if (!rows || !cols || !m.length) return emptyMsg(W, H, 'Không có lưới dữ liệu.');
  const mL = 46, mT = 26, mR = 12, mB = 20;
  const cw = (W - mL - mR) / cols, ch = (H - mT - mB) / rows;
  let lo = Infinity, hi = -Infinity;
  m.forEach(r => safeArr(r).forEach(x => { if (isFinite(x)) { if (x < lo) lo = x; if (x > hi) hi = x; } }));
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const nrm = x => (x - lo) / ((hi - lo) || 1);
  const mc = v.maxCell || {};
  let g = `<text class="axl" x="${mL}" y="16">${esc(v.title || 'Lưới')}${v.unit ? ' (' + esc(v.unit) + ')' : ''} · entropy ${fmt(v.entropy, 3)}</text>`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const row = m[r]; const val = (row && row[c] != null && isFinite(row[c])) ? row[c] : 0;
    const isMax = mc.r === r && mc.c === c;
    g += `<rect x="${(mL + c * cw).toFixed(1)}" y="${(mT + r * ch).toFixed(1)}" width="${Math.max(cw - 1, .5).toFixed(1)}" height="${Math.max(ch - 1, .5).toFixed(1)}" fill="${seqColor(nrm(val))}" opacity=".82" stroke="${isMax ? '#e6e6f0' : 'none'}" stroke-width="${isMax ? 1.6 : 0}"><title>hàng ${r + 1}, cột ${c + 1}: ${fmt(val, 3)}</title></rect>`;
  }
  return svg(W, H, g) + legend([['Giá trị thấp', seqColor(0)], ['Giá trị cao', seqColor(1)],
    [`Ô lớn nhất: hàng ${fmt((mc.r || 0) + 1, 0)}, cột ${fmt((mc.c || 0) + 1, 0)}`, '#e6e6f0']]);
}
const DISCRETE_DRAW = { graph, tree, hamming, quadtree, lbp, blobs, partition, bipartite, grid };

/* Tám bộ vẽ cho TẦNG THỐNG KÊ ỨNG DỤNG bộ dữ liệu ảnh: so sánh phân phối (ecdf, roc), hồi quy
   và tương quan (scatterFit, corr), điểm đổi và bootstrap (changepoint, bootstrap), và hai bộ
   dành riêng cho ảnh: mất cân bằng nhãn (imbalance), nghi ngờ gán nhãn sai (noise).
   Bốn bộ scatterFit/corr/changepoint/bootstrap giữ nguyên logic của skill dataset-4layer-report,
   chỉ thêm khung bảo vệ khi dữ liệu rỗng. Không dùng thư viện ngoài, không truy cập document.*. */
const C_A = '#5ec8bd', C_B = '#d9a441', C_C = '#8b7fd4', C_D = '#d4756b', C_E = '#6f9fd8';

/* Lọc bỏ giá trị không hữu hạn, tránh NaN lan vào chuỗi SVG trả về. */
const finite = a => (a || []).filter(v => typeof v === 'number' && isFinite(v));

/* Khung trống dùng chung khi dữ liệu rỗng hoặc thiếu để không vẽ ra biểu đồ gãy. */
const emptyPanel = (W, H, msg) => svg(W, H, `<text class="axt" x="${(W / 2).toFixed(1)}" y="${(H / 2).toFixed(1)}" text-anchor="middle">${esc(msg)}</text>`);

/* T1 - ECDF: hai đường phân phối tích lũy A và B chồng nhau, đánh dấu khoảng cách Kolmogorov
   Smirnov lớn nhất bằng đoạn thẳng đứng nổi bật, kèm hai histogram gốc chồng mờ bên dưới. */
function ecdf(c, W, H) {
  const ax = finite(c.aEcdf && c.aEcdf.x), ay = finite(c.aEcdf && c.aEcdf.y);
  const bx = finite(c.bEcdf && c.bEcdf.x), by = finite(c.bEcdf && c.bEcdf.y);
  if (!ax.length || !bx.length) return emptyPanel(W, H, 'Không đủ dữ liệu để tính ECDF.');
  const hTop = H * 0.6, xd = padExtent(ax.concat(bx), .04);
  const xl = c.unit ? 'Giá trị (' + c.unit + ')' : 'Giá trị';
  const f = frame(W, hTop, xd, [0, 1.04], xl, 'Tỉ lệ tích lũy', { yn: 5 });
  let g = f.g + line(ax.map((x, i) => [f.x(x), f.y(ay[i])]), C_A, 1.8) +
    line(bx.map((x, i) => [f.x(x), f.y(by[i])]), C_B, 1.8);
  const d = c.dAt || {};
  if (isFinite(d.x) && isFinite(d.lo) && isFinite(d.hi)) {
    const px = f.x(d.x);
    g += `<line x1="${px.toFixed(1)}" y1="${f.y(d.lo).toFixed(1)}" x2="${px.toFixed(1)}" y2="${f.y(d.hi).toFixed(1)}" stroke="${C_D}" stroke-width="2.6"/>` +
      `<text class="axt" x="${(px + 5).toFixed(1)}" y="${((f.y(d.hi) + f.y(d.lo)) / 2).toFixed(1)}" fill="${C_D}">KS = ${fmt(Math.abs(d.hi - d.lo), 3)}</text>`;
  }
  const aH = c.aHist, bH = c.bHist;
  if (aH && bH && aH.counts && bH.counts && aH.counts.length && bH.counts.length) {
    const hx = scale(xd[0], xd[1], PAD.l, W - PAD.r), maxC = Math.max(...aH.counts, ...bH.counts, 1);
    const hy0 = H - 4, hy = scale(0, maxC * 1.08, hy0, hTop + 16);
    g += `<text class="axt" x="${PAD.l}" y="${(hTop + 12).toFixed(1)}">Tần suất gốc</text>` +
      histBars(aH, hx, hy, hy0, C_A, .4) + histBars(bH, hx, hy, hy0, C_B, .34);
  }
  return svg(W, H, g) + legend([[c.aLabel || 'Nhóm A', C_A], [c.bLabel || 'Nhóm B', C_B], ['Khoảng cách KS lớn nhất', C_D]]);
}

/* T2 - ROC: đường cong độ nhạy theo tỉ lệ dương giả, tô nhạt vùng dưới đường cong, đường chéo
   tham chiếu của bộ phân loại ngẫu nhiên, ghi AUC to rõ, kèm histogram điểm số hai nhóm. */
function roc(c, W, H) {
  const fp = finite(c.fpr), tp = finite(c.tpr);
  if (fp.length < 2 || tp.length < 2 || fp.length !== tp.length) return emptyPanel(W, H, 'Không đủ điểm để vẽ đường cong ROC.');
  const hTop = H * 0.62;
  const f = frame(W, hTop, [0, 1], [0, 1.04], 'Tỉ lệ dương giả', 'Tỉ lệ dương thật', { xn: 5, yn: 5 });
  const pts = fp.map((x, i) => [f.x(x), f.y(tp[i])]), base = fp.map(x => [f.x(x), f.y(0)]);
  let g = f.g + area(pts, base, C_A, .16) + line([[f.x(0), f.y(0)], [f.x(1), f.y(1)]], C_C, 1, '4 3') + line(pts, C_A, 2.2);
  g += `<text x="${(W - PAD.r - 6).toFixed(1)}" y="${(PAD.t + 18).toFixed(1)}" text-anchor="end" font-size="20" fill="${C_A}">AUC = ${isFinite(c.auc) ? fmt(c.auc, 3) : '–'}</text>`;
  const aH = c.aHist, bH = c.bHist;
  if (aH && bH && aH.counts && bH.counts && aH.counts.length && bH.counts.length) {
    const xd2 = padExtent(finite(aH.edges).concat(finite(bH.edges)), .04);
    const hx = scale(xd2[0], xd2[1], PAD.l, W - PAD.r), maxC = Math.max(...aH.counts, ...bH.counts, 1);
    const hy0 = H - 4, hy = scale(0, maxC * 1.08, hy0, hTop + 16);
    g += `<text class="axt" x="${PAD.l}" y="${(hTop + 12).toFixed(1)}">Phân bố điểm số hai nhóm</text>` +
      histBars(aH, hx, hy, hy0, C_A, .4) + histBars(bH, hx, hy, hy0, C_B, .34);
  }
  return svg(W, H, g) + legend([[c.aLabel || 'Nhóm A', C_A], [c.bLabel || 'Nhóm B', C_B], ['Đường tham chiếu ngẫu nhiên', C_C]]);
}

/* T3 - hồi quy tuyến tính: điểm dữ liệu, đường khớp, dải tin cậy, và phần dư. */
function scatterFit(c, W, H) {
  if (!(c.points || []).length || !(c.fitX || []).length) return emptyPanel(W, H, 'Không đủ điểm dữ liệu để khớp hồi quy.');
  const hTop = H * 0.74;
  const xs = c.points.map(p => p[0]), ys = c.points.map(p => p[1]);
  const xd = padExtent(xs), yd = padExtent(ys.concat(c.ciHi, c.ciLo));
  const f = frame(W, hTop, xd, yd, '', c.yLabel);
  const top = c.fitX.map((x, i) => [f.x(x), f.y(c.ciHi[i])]), bot = c.fitX.map((x, i) => [f.x(x), f.y(c.ciLo[i])]);
  let g = f.g + area(top, bot, C_B, .15) + line(top, C_B, .8, '3 3') + line(bot, C_B, .8, '3 3');
  g += c.points.map(p => `<circle cx="${f.x(p[0]).toFixed(1)}" cy="${f.y(p[1]).toFixed(1)}" r="3" fill="${C_A}" opacity=".62"><title>(${fmt(p[0])} ; ${fmt(p[1])})</title></circle>`).join('');
  g += line(c.fitX.map((x, i) => [f.x(x), f.y(c.fitY[i])]), C_B, 2.2);
  const rd = padExtent(c.resid), ry = scale(rd[0], rd[1], H - 8, hTop + (H - hTop) * 0.42);
  g += `<line class="ax" x1="${PAD.l}" y1="${ry(0)}" x2="${W - PAD.r}" y2="${ry(0)}"/>`;
  g += `<text class="axt" x="${PAD.l}" y="${(hTop + (H - hTop) * 0.3).toFixed(1)}">Phần dư quanh đường hồi quy</text>`;
  g += c.points.map((p, i) => `<circle cx="${f.x(p[0]).toFixed(1)}" cy="${ry(c.resid[i]).toFixed(1)}" r="1.9" fill="${C_C}" opacity=".55"/>`).join('');
  g += `<text class="axl" x="${(PAD.l + W - PAD.r) / 2}" y="${(hTop + 4).toFixed(1)}" text-anchor="middle">${esc(c.xLabel || '')}</text>`;
  return svg(W, H, g) + legend([['Quan sát', C_A], ['Đường hồi quy OLS', C_B], ['Dải tin cậy 95%', C_B], ['Phần dư', C_C]]);
}

/* T4 - tương quan: tán xạ theo giá trị gốc và theo hạng, kèm bản đồ nhiệt của ma trận. */
function corr(c, W, H) {
  if (!(c.points || []).length) return emptyPanel(W, H, 'Không đủ điểm dữ liệu để tính tương quan.');
  const hasM = c.matrix && c.matrix.m && c.matrix.m.length > 1;
  const hTop = hasM ? H * 0.52 : H;
  const gap = 40, half = (W - PAD.l - PAD.r - gap) / 2;
  const xs = c.points.map(p => p[0]), ys = c.points.map(p => p[1]);
  const f1 = frame(PAD.l + half + PAD.r, hTop, padExtent(xs), padExtent(ys), c.xLabel, c.yLabel);
  let g = f1.g + c.points.map(p => `<circle cx="${f1.x(p[0]).toFixed(1)}" cy="${f1.y(p[1]).toFixed(1)}" r="2.8" fill="${C_A}" opacity=".6"/>`).join('') +
    `<text class="axt" x="${PAD.l}" y="11">Giá trị gốc · Pearson</text>`;
  const off = PAD.l + half + gap;
  const rx = scale(0, c.points.length, off, W - PAD.r), ry = scale(0, c.points.length, hTop - PAD.b, PAD.t);
  g += `<line class="ax" x1="${off}" y1="${hTop - PAD.b}" x2="${W - PAD.r}" y2="${hTop - PAD.b}"/><line class="ax" x1="${off}" y1="${PAD.t}" x2="${off}" y2="${hTop - PAD.b}"/>`;
  g += (c.rankPoints || []).map(p => `<circle cx="${rx(p[0]).toFixed(1)}" cy="${ry(p[1]).toFixed(1)}" r="2.8" fill="${C_C}" opacity=".6"/>`).join('');
  g += `<text class="axt" x="${off}" y="11">Theo hạng · Spearman</text>` +
    `<text class="axl" x="${(off + W - PAD.r) / 2}" y="${(hTop - 3).toFixed(1)}" text-anchor="middle">Hạng của x</text>`;
  if (hasM) g += heatmapG(c.matrix.m, c.matrix.labels, PAD.l * 0.4, hTop + 8, W - PAD.l * 0.4 - PAD.r, H - hTop - 12, c.matrix.title);
  return svg(W, H, g) + legend([['Giá trị gốc', C_A], ['Theo hạng', C_C], ['Ô xanh: dương', C_A], ['Ô đỏ: âm', C_D]]);
}

/* T5 - điểm đổi: chuỗi gốc kèm mốc phát hiện, và đường CUSUM tích lũy ở dưới. */
function changepoint(c, W, H) {
  const series = c.series || [];
  if (!series.length) return emptyPanel(W, H, 'Không đủ dữ liệu chuỗi để dò điểm đổi.');
  const hTop = H * 0.63, n = series.length;
  const f = frame(W, hTop, [0, n - 1], padExtent(series), '', 'Giá trị');
  let g = f.g + line(series.map((v, i) => [f.x(i), f.y(v)]), C_A, 1.5);
  g += `<line x1="${PAD.l}" y1="${f.y(c.mu)}" x2="${W - PAD.r}" y2="${f.y(c.mu)}" stroke="${C_C}" stroke-width=".9" stroke-dasharray="4 3"/>`;
  const mark = (i, col, txt, dy) => {
    if (i === null || i === undefined) return '';
    const px = f.x(i), right = px > W - 130;
    return `<line x1="${px}" y1="${PAD.t}" x2="${px}" y2="${hTop - PAD.b}" stroke="${col}" stroke-width="1.6" opacity=".9"/>` +
      `<text class="axt" x="${right ? px - 5 : px + 5}" y="${PAD.t + dy}" text-anchor="${right ? 'end' : 'start'}" fill="${col}">${esc(txt)} @ ${i}</text>`;
  };
  g += mark(c.seg, C_D, 'điểm đổi', 12) + mark(c.cp, C_B, 'CUSUM', 26);
  const cusumHi = c.cusumHi || [], cusumLo = c.cusumLo || [];
  const rest = H - hTop, cd = padExtent(cusumHi.concat(cusumLo, [c.h, -c.h]));
  const cy = scale(cd[0], cd[1], H - 8, hTop + rest * 0.34);
  g += `<line class="ax" x1="${PAD.l}" y1="${cy(0)}" x2="${W - PAD.r}" y2="${cy(0)}"/>`;
  g += `<text class="axt" x="${PAD.l}" y="${(hTop + rest * 0.22).toFixed(1)}">CUSUM hai phía · ngưỡng ±5σ (nét đứt)</text>`;
  g += line(cusumHi.map((v, i) => [f.x(i), cy(v)]), C_B, 1.4) + line(cusumLo.map((v, i) => [f.x(i), cy(v)]), C_E, 1.4);
  [c.h, -c.h].forEach(h => { g += `<line x1="${PAD.l}" y1="${cy(h)}" x2="${W - PAD.r}" y2="${cy(h)}" stroke="${C_D}" stroke-width=".8" stroke-dasharray="3 3" opacity=".7"/>`; });
  g += `<text class="axl" x="${(PAD.l + W - PAD.r) / 2}" y="${(hTop + 4).toFixed(1)}" text-anchor="middle">${esc(c.xLabel || '')}</text>`;
  return svg(W, H, g) + legend([[c.label || 'Chuỗi giá trị', C_A], ['Trung bình chuẩn', C_C], ['CUSUM dương', C_B], ['CUSUM âm', C_E], ['Ngưỡng / điểm đổi', C_D]]);
}

/* T6 - bootstrap: phân phối của ước lượng sau nhiều lần lấy lại mẫu, khoảng tin cậy BCa. */
function bootstrap(c, W, H) {
  if (!(c.hist && c.hist.counts && c.hist.counts.length)) return emptyPanel(W, H, 'Không đủ dữ liệu để dựng phân phối bootstrap.');
  const nullArr = (c.null === null || c.null === undefined) ? [] : [c.null];
  const xd = padExtent(finite(c.hist.edges).concat(finite(nullArr)));
  const maxC = Math.max(...c.hist.counts, 1), hc = H - 22;
  const f = frame(W, hc, xd, [0, maxC * 1.1], '', 'Số lần lấy lại mẫu', { yn: 4 });
  let g = f.g + histBars(c.hist, f.x, f.y, hc - PAD.b, C_C, .5);
  const vline = (v, col, txt, dy, dash) => `<line x1="${f.x(v)}" y1="${PAD.t}" x2="${f.x(v)}" y2="${hc - PAD.b}" stroke="${col}" stroke-width="1.6"${dash ? ' stroke-dasharray="4 3"' : ''}/>` +
    `<text class="axt" x="${f.x(v) + 5}" y="${PAD.t + dy}" fill="${col}">${esc(txt)}</text>`;
  if (isFinite(c.pctLo) && isFinite(c.pctHi)) {
    [c.pctLo, c.pctHi].forEach(v => { g += `<line x1="${f.x(v)}" y1="${PAD.t}" x2="${f.x(v)}" y2="${hc - PAD.b}" stroke="${C_E}" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/>`; });
    g += `<text class="axt" x="${f.x(c.pctLo) - 4}" y="${hc - PAD.b - 5}" text-anchor="end" fill="${C_E}">phân vị thuần</text>`;
  }
  if (isFinite(c.lo)) g += vline(c.lo, C_B, 'BCa 2,5%', 12, 1);
  if (isFinite(c.hi)) g += vline(c.hi, C_B, 'BCa 97,5%', 12, 1);
  if (isFinite(c.point)) g += vline(c.point, C_A, 'ước lượng điểm', 26);
  if (c.null !== null && c.null !== undefined) g += vline(c.null, C_D, 'giả thuyết H₀ = 0', 40);
  if (isFinite(c.lo) && isFinite(c.hi)) g += `<rect x="${f.x(c.lo)}" y="${hc - PAD.b + 6}" width="${Math.max(f.x(c.hi) - f.x(c.lo), 1)}" height="7" rx="3.5" fill="${C_B}" opacity=".5"/>`;
  g += `<text class="axl" x="${(PAD.l + W - PAD.r) / 2}" y="${H - 4}" text-anchor="middle">${esc(c.what || '')}</text>`;
  return svg(W, H, g) + legend([[`Phân phối bootstrap (${fmt(c.B, 0)} lần)`, C_C], ['Khoảng BCa 95%', C_B],
    ['Khoảng phân vị thuần', C_E], ['Ước lượng điểm', C_A]]);
}

/* Lưu ý đơn vị: Python đã trả share, rate, lo, hi, overall theo thang phần trăm 0-100.
   Nhân thêm 100 ở đây là lỗi cũ từng làm mọi cột kịch khung và nhãn ghi 2.500%. */
/* T7 - mất cân bằng nhãn: cột ngang tỉ lệ từng lớp trên trục phần trăm, kèm thanh sai số
   khoảng tin cậy Wilson, số lượng n ghi cạnh cột, và danh sách lớp cần bổ sung ảnh. */
function imbalance(c, W, H) {
  const bars = Array.isArray(c.bars) ? c.bars : [];
  if (!bars.length) return emptyPanel(W, H, 'Không có dữ liệu lớp để đánh giá mất cân bằng.');
  const need = (Array.isArray(c.need) ? c.need : []).filter(x => x && x.add > 0);
  const leftM = 118, rightM = W - 14, needH = 22, chH = H - needH - 4;
  const maxPct = Math.max(1, ...bars.map(b => Math.max(b.share || 0, isFinite(b.hi) ? b.hi : 0)));
  const x = scale(0, maxPct * 1.08, leftM, rightM);
  const rh = Math.max(14, Math.min(30, (chH - 8) / bars.length));
  const short = s => { const t = (s === undefined || s === null || s === '') ? '?' : String(s); return t.length > 15 ? t.slice(0, 14) + '…' : t; };
  let g = `<line class="ax" x1="${leftM}" y1="4" x2="${leftM}" y2="${(4 + rh * bars.length).toFixed(1)}"/>`;
  bars.forEach((b, i) => {
    const cy = 4 + i * rh + rh / 2, pct = b.share || 0;
    g += `<text class="axt" x="${leftM - 6}" y="${(cy + 3).toFixed(1)}" text-anchor="end">${esc(short(b.label))}</text>`;
    g += `<rect x="${x(0).toFixed(1)}" y="${(cy - rh * 0.32).toFixed(1)}" width="${Math.max(x(pct) - x(0), .5).toFixed(1)}" height="${(rh * 0.64).toFixed(1)}" fill="${C_A}" opacity=".6" rx="2"/>`;
    if (isFinite(b.lo) && isFinite(b.hi)) {
      g += `<line x1="${x(b.lo).toFixed(1)}" y1="${cy.toFixed(1)}" x2="${x(b.hi).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${C_D}" stroke-width="1.4"/>` +
        `<line x1="${x(b.lo).toFixed(1)}" y1="${(cy - 3).toFixed(1)}" x2="${x(b.lo).toFixed(1)}" y2="${(cy + 3).toFixed(1)}" stroke="${C_D}" stroke-width="1.2"/>` +
        `<line x1="${x(b.hi).toFixed(1)}" y1="${(cy - 3).toFixed(1)}" x2="${x(b.hi).toFixed(1)}" y2="${(cy + 3).toFixed(1)}" stroke="${C_D}" stroke-width="1.2"/>`;
    }
    g += `<text class="axt" x="${rightM}" y="${(cy + 3).toFixed(1)}" text-anchor="end">${fmt(pct, 1)}% · n = ${fmt(b.n || 0, 0)}</text>`;
  });
  for (const t of ticks(0, maxPct * 1.08, 5)) {
    g += `<text class="axt" x="${x(t).toFixed(1)}" y="${(4 + rh * bars.length + 12).toFixed(1)}" text-anchor="middle">${fmt(t)}%</text>`;
  }
  const needTxt = need.length ? 'Cần bổ sung: ' + need.map(n => esc(short(n.label)) + ' +' + fmt(n.add, 0)).join(', ')
    : 'Các lớp đã cân bằng, không lớp nào cần bổ sung ảnh.';
  g += `<text class="axt" x="${PAD.l}" y="${(H - 6).toFixed(1)}">${needTxt}</text>`;
  const lg = [['Tỉ lệ mỗi lớp', C_A], ['Khoảng tin cậy Wilson 95%', C_D]];
  if (isFinite(c.entropy)) lg.push(['Entropy = ' + fmt(c.entropy, 3), C_B]);
  if (isFinite(c.gini)) lg.push(['Gini = ' + fmt(c.gini, 3), C_C]);
  return svg(W, H, g) + legend(lg);
}

/* T8 - nghi ngờ gán nhãn sai: cột tỉ lệ bất đồng từng lớp kèm thanh sai số, vạch ngang mức
   chung, và dải thumbnail tối đa 10 ảnh ứng viên ghi rõ nhãn gốc chuyển sang nhãn nghi ngờ. */
function noise(c, W, H) {
  const bars = Array.isArray(c.bars) ? c.bars : [];
  const cands = (Array.isArray(c.cands) ? c.cands : []).filter(cd => cd && cd.src).slice(0, 10);
  const chartH = bars.length ? H * 0.5 : 26;
  const short = s => { const t = (s === undefined || s === null || s === '') ? '?' : String(s); return t.length > 10 ? t.slice(0, 9) + '…' : t; };
  let g = '';
  if (bars.length) {
    const topM = 14, botM = chartH - 28;
    const maxPct = Math.max(1, ...bars.map(b => Math.max(b.rate || 0, isFinite(b.hi) ? b.hi : 0)));
    const y = scale(0, maxPct * 1.1, botM, topM);
    const n = bars.length, bw = Math.max(10, Math.min(52, (W - PAD.l - PAD.r) / n - 10));
    const cx = i => PAD.l + (i + .5) * (W - PAD.l - PAD.r) / n;
    g += `<line class="ax" x1="${PAD.l}" y1="${botM}" x2="${W - PAD.r}" y2="${botM}"/>`;
    bars.forEach((b, i) => {
      const pct = b.rate || 0, x0 = cx(i) - bw / 2;
      g += `<rect x="${x0.toFixed(1)}" y="${y(pct).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(y(0) - y(pct), .5).toFixed(1)}" fill="${C_D}" opacity=".6" rx="2"/>`;
      if (isFinite(b.lo) && isFinite(b.hi)) {
        g += `<line x1="${cx(i).toFixed(1)}" y1="${y(b.lo).toFixed(1)}" x2="${cx(i).toFixed(1)}" y2="${y(b.hi).toFixed(1)}" stroke="${C_C}" stroke-width="1.4"/>`;
      }
      g += `<text class="axt" x="${cx(i).toFixed(1)}" y="${(y(pct) - 5).toFixed(1)}" text-anchor="middle">${fmt(pct, 1)}%</text>` +
        `<text class="axt" x="${cx(i).toFixed(1)}" y="${(botM + 13).toFixed(1)}" text-anchor="middle">${esc(short(b.label))}</text>`;
    });
    if (isFinite(c.overall)) {
      const oy = y(c.overall);
      g += `<line x1="${PAD.l}" y1="${oy.toFixed(1)}" x2="${W - PAD.r}" y2="${oy.toFixed(1)}" stroke="${C_B}" stroke-width="1.4" stroke-dasharray="4 3"/>` +
        `<text class="axt" x="${(W - PAD.r).toFixed(1)}" y="${(oy - 4).toFixed(1)}" text-anchor="end" fill="${C_B}">chung ${fmt(c.overall, 1)}%</text>`;
    }
  } else {
    g += `<text class="axt" x="${(W / 2).toFixed(1)}" y="16" text-anchor="middle">Không có lớp nào để so sánh tỉ lệ bất đồng.</text>`;
  }
  if (cands.length) {
    const n2 = cands.length, gap = 6, cw = Math.min(94, (W - gap * (n2 + 1)) / n2), ch2 = cw, y0 = chartH + 20;
    g += `<text class="axt" x="${PAD.l}" y="${(chartH + 10).toFixed(1)}">Ứng viên nghi ngờ gán nhãn sai</text>`;
    cands.forEach((cd, i) => {
      const cxp = gap + i * (cw + gap);
      g += `<image href="${esc(cd.src)}" x="${cxp.toFixed(1)}" y="${y0.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch2.toFixed(1)}" preserveAspectRatio="xMidYMid slice"/>` +
        `<rect x="${cxp.toFixed(1)}" y="${y0.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch2.toFixed(1)}" fill="none" stroke="${C_D}" stroke-width="1" opacity=".6"/>` +
        `<text class="axt" x="${(cxp + cw / 2).toFixed(1)}" y="${(y0 + ch2 + 12).toFixed(1)}" text-anchor="middle">${esc(cd.from || '?')} → ${esc(cd.to || '?')}</text>`;
    });
  } else {
    g += `<text class="axt" x="${PAD.l}" y="${(chartH + 16).toFixed(1)}">Không có ứng viên nghi ngờ gán nhãn sai.</text>`;
  }
  return svg(W, H, g) + legend([['Tỉ lệ bất đồng theo lớp', C_D], ['Khoảng tin cậy Wilson', C_C], ['Mức chung', C_B]]);
}

const STAT_DRAW = { ecdf, roc, scatterFit, corr, changepoint, bootstrap, imbalance, noise };

/* Cửa sổ khám phá dữ liệu ảnh theo bốn lớp tư duy top-down.
   Thứ tự bốn lớp không đảo được: hiểu nguồn gốc trước, nhìn phân bố tổng thể, rồi mới soi quan hệ
   giữa các đại lượng, cuối cùng mới đụng tới từng ảnh cụ thể. */

const XP_INTRO =
  'Bốn lớp dưới đây đi từ trên xuống. Mỗi lớp trả lời trọn một câu hỏi rồi mới mở sang lớp sau, ' +
  'để mọi quyết định xóa ảnh, sửa nhãn hay bổ sung dữ liệu đều có chỗ dựa thay vì làm theo cảm tính.';

/* Dải ảnh thu nhỏ kèm chú thích, dùng lại ở nhiều chỗ trong cửa sổ. */
function thumbStrip(items, capKey) {
  if (!items || !items.length) return '<p class="xp-note">Không có ảnh nào thuộc nhóm này.</p>';
  return '<div class="tg">' + items.map(t =>
    `<figure><img src="${esc(t.src)}" alt=""><figcaption>${esc(String(t[capKey] || ''))}</figcaption></figure>`
  ).join('') + '</div>';
}

/* Cặp ảnh đặt cạnh nhau, dùng cho trùng lặp và rò rỉ. */
function pairStrip(pairs, warnKey) {
  if (!pairs || !pairs.length) return '<p class="xp-note">Không tìm thấy cặp nào.</p>';
  return '<div class="tp">' + pairs.map(p => {
    const warn = warnKey && p[warnKey];
    const cap = [p.d !== undefined ? 'Hamming ' + fmt(p.d, 0) : '',
                 p.r !== undefined ? 'r = ' + fmt(p.r, 4) : '',
                 p.sa && p.sb ? esc(p.sa) + ' ↔ ' + esc(p.sb) : ''].filter(Boolean).join('<br>');
    return `<div class="pr${warn ? ' warn' : ''}"><img src="${esc(p.a)}" alt=""><img src="${esc(p.b)}" alt="">` +
           `<span class="cap">${cap}</span></div>`;
  }).join('') + '</div>';
}

function xpSec(no, title, lead, body) {
  return `<div class="xp-sec"><div class="xp-no">${esc(no)}</div><div class="xp-body">
    <h3>${esc(title)}</h3><p class="xp-lead">${esc(lead)}</p>${body}</div></div>`;
}

const cells = rows => '<div class="xp-grid">' + rows.map(([k, v]) =>
  `<div class="xp-cell"><div class="kk">${esc(k)}</div><div class="kvv">${esc(String(v))}</div></div>`).join('') + '</div>';

const chips = (items, offIf) => '<div class="chips">' + items.map(t =>
  `<span class="chip${offIf && offIf(t) ? ' off' : ''}">${esc(t)}</span>`).join('') + '</div>';

/* --- Lớp 1: nguồn cội --- */
function xpLayer1(o, l1, meta) {
  const n = l1.narrative || {};
  const missing = !n.system;
  let b = missing
    ? '<p class="xp-note"><b>Đặc tả chưa khai <code>narrative.system</code>.</b> Trang dựng được hết ' +
      'phần số liệu nhưng không ai biết ảnh này chụp cái gì, bằng thiết bị nào. Phần diễn giải bên ' +
      'dưới sẽ thiếu chỗ dựa.</p>'
    : `<p class="xp-fact">${esc(n.system)}</p>`;
  if (n.capture) b += `<h5>Điều kiện thu thập</h5><p class="xp-fact">${esc(n.capture)}</p>`;
  if (n.noise) b += `<h5>Nhiễu</h5><p class="xp-fact">${esc(n.noise)}</p>`;

  b += '<h5>Bộ dữ liệu mang theo những gì</h5>' +
    chips(Object.keys(meta.capNames).map(k => meta.capNames[k] + (l1.caps[k] ? '' : ' (không có)')),
          t => t.indexOf('(không có)') >= 0);

  b += cells([
    ['Ảnh khai báo', fmt(l1.counts.declared, 0)],
    ['Ảnh đọc được', fmt(l1.counts.read, 0)],
    ['Tệp hỏng', fmt(l1.counts.broken, 0)],
    ['Độ phân giải chính', o.resolution + (l1.resolutionUniform ? ' (đồng nhất)' : ' (còn dạng khác)')],
    ['Dung lượng trung vị', fmt(l1.fileKB.med, 1) + ' KB'],
    ['Số điểm ảnh trung vị', fmt(l1.megapx.med, 3) + ' triệu'],
  ]);

  if (l1.resolutions.length > 1)
    b += '<h5>Các độ phân giải gặp phải</h5>' +
      chips(l1.resolutions.map(r => r.label + ' · ' + r.n));
  b += '<h5>Định dạng và chế độ màu</h5>' +
    chips(l1.formats.map(f => f.label + ' · ' + f.n).concat(l1.modes.map(m => m.label + ' · ' + m.n)));
  if (l1.cameras.length)
    b += '<h5>Thiết bị đọc được từ EXIF</h5>' + chips(l1.cameras.map(c => c.label + ' · ' + c.n));
  if (l1.counts.broken)
    b += '<h5>Tệp không đọc được</h5>' + chips(l1.counts.brokenList.map(x => x.file + ' · ' + x.err));
  if (l1.sampled)
    b += '<p class="xp-note">Bộ dữ liệu vượt trần <code>sample</code> nên trang chạy trên mẫu phân ' +
         'tầng theo lớp, giữ nguyên tỉ lệ lớp hiếm.</p>';
  return xpSec('LỚP 1', 'Nguồn cội: quá trình nào sinh ra bộ ảnh này',
    'Đừng phân tích một tấm ảnh nếu chưa biết ai chụp nó, bằng gì, để làm gì. Mọi đặc trưng đo ' +
    'được ở các lớp sau đều là hệ quả của quá trình chụp, không phải tính chất tự thân của vật thể.', b);
}

/* --- Lớp 2: kiến trúc vĩ mô --- */
function xpLayer2(o, l2) {
  let b = '';
  if (l2.balance) {
    const mx = Math.max(...l2.balance.counts);
    b += '<h5>Cân bằng lớp</h5><table class="xp-tb"><tr><th class="l">Lớp</th><th>Số ảnh</th>' +
      '<th>Tỉ lệ</th><th class="l">Độ dày</th></tr>' +
      l2.balance.names.map((nm, i) => {

          `<td class="l"><span class="bar"><b style="width:${(n / mx * 100).toFixed(1)}%;background:#6f9fd8"></b></span></td></tr>`;
      }).join('') + '</table>' +
      `<p class="xp-note">Lớp đông nhất gấp <b>${fmt(l2.balance.ratio, 1)}</b> lần lớp hiếm nhất. ` +
      'Trong kiểm tra chất lượng, lỗi luôn hiếm hơn hàng đạt, nên mất cân bằng là trạng thái bình ' +
      'thường của dữ liệu chứ không phải sai sót. Việc cần làm là bù mẫu có chủ đích, không phải ' +
      'xóa bớt lớp đông.</p>';
  } else {
    b += '<p class="xp-note">Bộ dữ liệu chưa gán nhãn nên không đo được cân bằng lớp.</p>';
  }

  b += '<h5>Ảnh bị đánh dấu theo điều kiện chụp</h5>';
  ['overexposed', 'underexposed', 'blurry'].forEach(k => {
    const f = l2.flags[k];
    b += `<p class="xp-fact">Ảnh ${esc(f.label)}: <b>${fmt(f.n, 0)}</b> ảnh, chiếm ` +
      `<b>${fmt(f.share, 1)}%</b>.</p>` + thumbStrip(f.samples, 'file');
  });
  b += `<p class="xp-note">Ngưỡng kém sắc nét lấy ở phân vị 10 của chính bộ dữ liệu này ` +
    `(phương sai Laplace ${fmt(l2.blurThr, 0)}), nên con số 10% là theo định nghĩa. Điều đáng xem ` +
    'là những ảnh đó rơi vào lớp nào: dồn vào một lớp thì lớp đó đang bị thiệt.</p>';

  b += '<h5>Phân bố từng đặc trưng</h5><table class="xp-tb"><tr><th class="l">Đặc trưng</th>' +

    '<th>Nhỏ nhất</th><th>Lớn nhất</th></tr>' +
    l2.dists.map(d => `<tr><td class="l">${esc(d.name)}</td><td class="l">${esc(d.group)}</td>` +
      `<td>${fmt(d.box.med)}</td><td>${fmt(d.box.q1)}</td><td>${fmt(d.box.q3)}</td>` +
      `<td>${fmt(d.box.lo)}</td><td>${fmt(d.box.hi)}</td></tr>`).join('') + '</table>';

  if (l2.classProfile) b += xpClassProfile(l2.classProfile);
  return xpSec('LỚP 2', 'Kiến trúc vĩ mô: khối dữ liệu phân bố ra sao',
    'Ở lớp này chưa soi ảnh nào cụ thể. Câu hỏi là toàn bộ tập ảnh nghiêng về đâu, thiếu ở đâu, ' +
    'và chỗ thiếu đó có trùng với chỗ quan trọng nhất của bài toán hay không.', b);

/* Hồ sơ đặc trưng từng lớp, tô màu theo độ lệch chuẩn để thấy ngay lớp nào lệch ở đâu. */
function xpClassProfile(cp) {
  const color = z => z > 0 ? `rgba(111,159,216,${Math.min(Math.abs(z) / 2, 1) * .75})`
                           : `rgba(214,140,110,${Math.min(Math.abs(z) / 2, 1) * .75})`;
  return '<h5>Hồ sơ đặc trưng trung bình của từng lớp (đơn vị: độ lệch chuẩn)</h5>' +
    '<table class="xp-tb"><tr><th class="l">Lớp</th><th>n</th>' +
    cp.cols.map(c => `<th>${esc(String(c))}</th>`).join('') + '</tr>' +
    cp.rows.map(r => `<tr><td class="l">${esc(r.label)}</td><td>${fmt(r.n, 0)}</td>` +
      r.z.map(z => `<td style="background:${color(z || 0)}">${fmt(z)}</td>`).join('') + '</tr>').join('') +
    '</table><p class="xp-note">Hai lớp khác nhau ở cột phơi sáng mà giống nhau ở cột cấu trúc là ' +
    'dấu hiệu xấu: mô hình sẽ học mức đèn thay vì học khuyết tật.</p>';
}

/* Hai lớp cuối của cửa sổ khám phá: mạng lưới tương quan và đứt gãy vi mô.
   Tách khỏi tệp explorer-popup.js để mỗi tệp giữ được một chủ đề và đọc vừa một màn hình. */

/* --- Lớp 3: mạng lưới tương quan --- */
function xpLayer3(l3) {
  const m = l3.matrix;
  let b = '<h5>Ma trận tương quan giữa các đặc trưng</h5>';
  b += m.labels.length
    ? svg(560, 560, heatmapG(m.m, m.labels, 88, 20, 440, 440, ''))
    : '<p class="xp-note">Không đủ đặc trưng biến thiên để dựng ma trận.</p>';
  b += '<p class="xp-note">Các đặc trưng đã xếp theo nhóm bản chất. Khối sáng nằm dọc đường chéo ' +
    'nghĩa là cách gom nhóm khớp với dữ liệu; khối sáng nằm lệch khỏi đường chéo là hai nhóm ' +
    'tưởng khác nhau nhưng thực ra đo cùng một thứ.</p>';

  if (l3.redundant.length) {
    b += '<h5>Cặp đặc trưng gần như trùng thông tin</h5><table class="xp-tb">' +
      '<tr><th class="l">Đặc trưng A</th><th class="l">Đặc trưng B</th><th>r</th></tr>' +
      l3.redundant.map(r => `<tr><td class="l">${esc(r.a)}</td><td class="l">${esc(r.b)}</td>` +
        `<td>${fmt(r.r)}</td></tr>`).join('') + '</table>' +
      '<p class="xp-note">Giữ cả hai đặc trưng trong một cặp như vậy chỉ làm mô hình nặng thêm mà ' +
      'không thêm thông tin. Bỏ bớt một là bước giảm chiều rẻ nhất.</p>';
  } else {
    b += '<h5>Cặp đặc trưng gần như trùng thông tin</h5>' +
      '<p class="xp-note">Không cặp nào vượt ngưỡng 0,90. Bộ đặc trưng hiện tại không dư thừa rõ rệt.</p>';
  }

  b += '<h5>Cấu trúc không gian nhúng</h5>' +
    `<p class="xp-fact">Hai thành phần chính đầu giữ <b>${fmt(l3.pca.evr[0], 1)}%</b> và ` +
    `<b>${fmt(l3.pca.evr[1] || 0, 1)}%</b> phương sai. Cần <b>${fmt(l3.pca.n90, 0)}</b> thành phần ` +
    `để giữ 90% phương sai của ${fmt(l3.pca.dims, 0)} chiều đặc trưng ban đầu.</p>` +
    xpScatter(l3);

  if (l3.classDistance && l3.classDistance.worst) {
    const w = l3.classDistance.worst;
    b += '<h5>Khoảng cách giữa tâm các lớp</h5>' +
      svg(460, 460, heatmapG(l3.classDistance.m, l3.classDistance.labels, 96, 20, 340, 340, '')) +
      `<p class="xp-note">Giá trị đã chia cho độ tản trong lớp, nên đọc được như số lần độ tản. ` +
      `Cặp sát nhau nhất là <b>${esc(w.a)}</b> và <b>${esc(w.b)}</b>, cách nhau ${fmt(w.d)} lần độ ` +
      'tản: dưới 1 thì hai lớp chồng lên nhau và đặc trưng cổ điển không tách nổi.</p>';
  }
  return xpSec('LỚP 3', 'Mạng lưới: các đại lượng liên hệ với nhau thế nào',
    'Đặc trưng ảnh không hoạt động độc lập. Biết cái nào kéo theo cái nào thì mới bỏ được phần dư ' +
    'thừa, và mới biết một khác biệt giữa hai lớp là khác biệt thật hay chỉ là bóng của biến khác.', b);
}

/* Phân tán hai thành phần chính, tô màu theo lớp. */
function xpScatter(l3) {
  const W = 520, H = 320, pts = l3.scatter;
  if (!pts.length) return '';
  const f = frame(W, H, [-0.04, 1.04], [-0.04, 1.04], 'Thành phần chính 1', 'Thành phần chính 2');
  const pal = ['#6f9fd8', '#d6a86e', '#7ec8a0', '#c98ec9', '#d67878', '#8ab6d6', '#c2c26e', '#9a9ad6'];
  let g = f.g;
  pts.forEach(p => {
    const c = p.cls >= 0 ? pal[p.cls % pal.length] : '#6b6b80';
    g += `<circle cx="${f.x(p.x).toFixed(1)}" cy="${f.y(p.y).toFixed(1)}" r="2.6" fill="${c}" opacity=".7"/>`;
  });
  const lg = l3.clsNames.length
    ? legend(l3.clsNames.map((n, i) => [n, pal[i % pal.length]]))
    : legend([['ảnh chưa gán nhãn', '#6b6b80']]);
  return svg(W, H, g) + lg;
}

/* --- Lớp 4: đứt gãy vi mô --- */
function xpLayer4(l4) {
  let b = `<h5>Trùng lặp byte-hệt-byte</h5><p class="xp-fact">Có <b>${fmt(l4.exactDup.n, 0)}</b> ảnh ` +
    'nằm trong một nhóm trùng mã băm MD5, tức là cùng một tệp được chép nhiều lần.</p>';
  if (l4.exactDup.groups.length)
    b += thumbStrip(l4.exactDup.groups.map(g => ({ src: g.src, file: g.n + ' bản: ' + g.files[0] })), 'file');

  const ed = l4.exactDup;
