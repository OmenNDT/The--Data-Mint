/* Cửa sổ "Thuật toán": dựng chuỗi HTML tra cứu mọi thuật toán trang báo cáo bộ dữ liệu ảnh
   dùng tới, đọc từ ALGO_CATALOG (algorithm-catalog-data.js). Không thao tác DOM ở đây, chỉ
   trả về chuỗi để nơi gọi tự gán vào innerHTML. Dùng esc() và fmt() toàn cục từ
   svg-primitives.js, không định nghĩa lại. */

/* Đếm tổng số mục trong mọi nhóm, dùng cho câu dẫn đầu trang. */
function algoCatalogCount() {
  return ALGO_CATALOG.reduce((n, g) => n + g.items.length, 0);
}

/* Một thẻ thuật toán: tên, hai nhãn (nhánh toán, độ phức tạp), đoạn việc dùng, đoạn ghi chú. */
function renderAlgoCard(item) {
  return `<article class="ag-card">
      <h4>${esc(item.name)}</h4>
      <div class="ag-tags"><span>${esc(item.branch)}</span><span class="cx">${esc(item.complexity)}</span></div>
      <p class="ag-sol"><b>Dùng để làm gì.</b> ${esc(item.use)}</p>
      <p class="xp-note"><b>Ghi chú.</b> ${esc(item.note)}</p>
    </article>`;
}

/* Một nhóm: tiêu đề nhóm cộng lưới thẻ. */
function renderAlgoGroup(group) {
  const cards = group.items.map(renderAlgoCard).join('');
  return `<h3 class="ag-grp">${esc(group.group)}</h3><div class="ag-grid">${cards}</div>`;
}

/* Dựng toàn bộ nội dung cửa sổ thuật toán: tiêu đề, đoạn dẫn ngắn, rồi từng nhóm. */
function renderAlgoGlossary() {
  const total = algoCatalogCount();
  const body = ALGO_CATALOG.map(renderAlgoGroup).join('');
  return `<div class="xp-head"><h2>Thuật toán dùng trong báo cáo bộ dữ liệu ảnh</h2>
      <span class="xp-close">Bấm ra ngoài hoặc Esc để đóng</span></div>
    <p class="xp-intro">${fmt(total, 0)} thuật toán, xếp theo bốn nhóm: các cấu trúc rời rạc dựng
      trực tiếp trên đặc trưng và mặt nạ ảnh, các phép thống kê suy luận chạy trên kết quả các cấu
      trúc đó, và các thuật toán nền dùng bên trong hai tầng trên. Mỗi mục nêu nhánh toán, việc làm
      cụ thể trên dữ liệu ảnh, độ phức tạp tính toán, và một ghi chú về giả định hoặc giới hạn cần
      nhớ khi đọc kết quả.</p>
    ${body}`;
}

/* Cửa sổ khái niệm: phần kiến thức lĩnh vực do người viết đặc tả cung cấp.
   Máy đọc được rằng một lớp có 12 ảnh và độ sáng trung bình 83; máy không biết lớp đó là gì và vì
   sao nó hiếm. Chỗ này cố ý để trống khi đặc tả chưa khai, thay vì bịa ra cho đầy trang. */

const CC_FIELDS = [
  ['system', 'Hệ thống sinh ra bộ ảnh'],
  ['capture', 'Điều kiện thu thập'],
  ['classes', 'Ý nghĩa các lớp'],
  ['defects', 'Biểu hiện của khuyết tật'],
  ['noise', 'Nhiễu và nguồn nhiễu'],
  ['order', 'Trật tự thu nhận'],
  ['split', 'Cách chia tập'],
];

function renderConcepts(dsId, overview, meta) {
  const n = meta.narrative || {};
  const filled = CC_FIELDS.filter(([k]) => n[k]);
  let h = `<div class="xp-head"><h2>Khái niệm bộ ảnh ${esc(dsId)}</h2>
    <span class="xp-close">bấm ra ngoài hoặc Esc để đóng</span></div>`;

  if (!filled.length) {
    return h + '<p class="xp-intro">Tệp đặc tả chưa khai mục <code>narrative</code>. Toàn bộ số ' +
      'liệu trên trang vẫn đúng, nhưng không có gì giải thích ảnh này chụp cái gì, lớp nhãn nghĩa ' +
      'là gì, khuyết tật biểu hiện ra sao. Đây là phần duy nhất trong cả đường ống mà máy không tự ' +
      'sinh được, và cũng là phần quyết định báo cáo có dùng được hay không.</p>';
  }

  h += '<p class="xp-intro">Phần dưới lấy nguyên văn từ tệp đặc tả. Số liệu thì máy tính được hết, ' +
    'còn ý nghĩa thì phải người biết việc viết ra.</p>';
  h += filled.map(([k, title]) =>
    `<div class="cc-sec"><h3>${esc(title)}</h3><p class="xp-fact">${esc(n[k])}</p></div>`).join('');

  const missing = CC_FIELDS.filter(([k]) => !n[k]);
  if (missing.length)
    h += '<h4>Mục chưa khai</h4>' + '<div class="chips">' +
      missing.map(([k, t]) => `<span class="chip off">${esc(t)} · narrative.${esc(k)}</span>`).join('') + '</div>';

  const cls = meta.classes || {};
  const keys = Object.keys(cls);
  if (keys.length) {
    h += '<h4>Từ điển lớp nhãn</h4><table class="xp-tb"><tr><th class="l">Mã lớp</th>' +
      '<th class="l">Tên đầy đủ</th><th>Số ảnh</th><th class="l">Ghi chú</th></tr>' +
      keys.map(k => {
        const found = (overview.classes || []).find(c => c.label === k);
        return `<tr><td class="l">${esc(k)}</td><td class="l">${esc(cls[k].name || '')}</td>` +
          `<td>${found ? fmt(found.n, 0) : '–'}</td><td class="l">${esc(cls[k].note || '')}</td></tr>`;
      }).join('') + '</table>';
  }

  const combos = (meta.discrete || []).length * (meta.stats || []).length;
  h += '<h4>Đọc giá trị p trên trang này thế nào</h4>' +
    `<p class="xp-fact">Trang có <b>${fmt(combos, 0)}</b> ô tổ hợp mỗi nguồn, mỗi ô một giá trị p ` +
    'riêng ở mức 5%. Chạy chừng đó phép kiểm trên cùng một bộ dữ liệu thì ngay cả khi không có hiệu ' +
    `ứng nào, vẫn có khoảng <b>${fmt(combos * 0.05, 1)}</b> ô cho kết quả "có ý nghĩa" thuần do ngẫu ` +
    'nhiên. Trang cố ý không tự hiệu chỉnh, vì hiệu chỉnh kiểu Bonferroni trên các phép kiểm phụ ' +
    'thuộc lẫn nhau lại quá tay theo chiều ngược.</p>' +
    '<p class="xp-note">Cách đọc đúng: đi vào trang với một câu hỏi định sẵn rồi xem đúng ô trả lời ' +
    'câu đó, thay vì quét hết lưới rồi nhặt ô nào đẹp. Một phát hiện đáng tin phải trụ được ở nhiều ' +
    'cấu trúc rời rạc khác nhau, không chỉ ở một ô duy nhất.</p>';

  const skipped = (meta.skipped.discrete || []).concat(meta.skipped.stats || []);
  if (skipped.length) {
    h += '<h4>Thuật toán bị khóa vì bộ dữ liệu chưa đủ năng lực</h4><table class="xp-tb">' +
      '<tr><th class="l">Thuật toán</th><th class="l">Lý do</th></tr>' +
      skipped.map(s => `<tr class="dim"><td class="l">${esc(s.title)}</td><td class="l">${esc(s.reason)}</td></tr>`).join('') +
      '</table><p class="xp-note">Khai bổ sung những trường còn thiếu trong tệp đặc tả rồi dựng lại ' +
      'thì các thuật toán này tự bật lên, không phải sửa mã.</p>';
  }
  return h;
}

/* Bộ điều khiển 4 tầng: giữ trạng thái lựa chọn và dựng lại tầng biểu đồ khi có thay đổi.
   Danh sách thuật toán lấy thẳng từ payload chứ không viết cứng, vì mỗi bộ dữ liệu mở khóa
   một tập thuật toán khác nhau tùy năng lực dò được. */
const P = window.__PAYLOAD__;
const L = P.meta.labels;
const DS_LIST = Object.keys(P.datasets);
const D_META = Object.fromEntries(P.meta.discrete.map(x => [x.id, x]));
const S_META = Object.fromEntries(P.meta.stats.map(x => [x.id, x]));

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

const state = { ds: DS_LIST[0], d: P.meta.discrete[0].id, s: P.meta.stats[0].id, tab: 'data' };
const SHEET_TABS = [['data', 'Khám phá dữ liệu'], ['algo', 'Thuật toán'], ['concept', 'Khái niệm bộ dữ liệu']];
const $ = id => document.getElementById(id);

/* --- Tầng 1: dữ liệu (một hàng ngang, chi tiết đẩy vào lớp phủ) --- */
function renderData() {
  const o = P.datasets[state.ds].overview;
  $('dsRow').innerHTML = DS_LIST.map(d => {
    const ov = P.datasets[d].overview;
    const sub = ov.nClasses ? `${ov.rows} ${L.entities} · ${ov.nClasses} ${L.class}`
                            : `${ov.rows} ${L.entities} · chưa gán nhãn`;
    return `<button class="ds${d === state.ds ? ' on' : ''}" data-ds="${esc(d)}" title="${esc(ov.label)}"><b>${esc(d)}</b><small>${esc(sub)}</small></button>`;
  }).join('');
  const kpi = [
    ['Số ảnh đọc được', fmt(o.rows, 0)],
    ['Độ phân giải', o.resolution + (o.resolutionUniform ? '' : ' (không đồng nhất)')],
    ['Ảnh trùng hoặc gần trùng', fmt(o.dupNear, 0)],
    [o.leakChecked ? 'Cặp trùng vắt qua tập chia' : 'Tỉ lệ ảnh dị thường',
      o.leakChecked ? fmt(o.leak + (o.dupSplitGroups || 0), 0) : fmt(o.outlierShare, 1) + '%'],
    ...(o.groupLeak === null || o.groupLeak === undefined
      ? [] : [['Nhóm bị chia đôi giữa hai tập', fmt(o.groupLeak, 0) + ' · tối đa ' + fmt(o.groupLeakShare, 0) + '% ảnh']]),
  ];
  $('kpis').innerHTML = kpi.map(([k, v]) =>
    `<div class="kpi"><div class="kk">${esc(k)}</div><div class="kvv">${esc(v)}</div></div>`).join('');
  $('mini').innerHTML = o.classes.length ? miniBalance(o) : miniHist(o);
  if ($('sheet').classList.contains('on')) renderSheet();
}

/* Cột cân bằng lớp thu nhỏ: thứ cần liếc thấy đầu tiên ở một bộ ảnh có nhãn. */
function miniBalance(o) {
  const W = 168, H = 62, cs = o.classes.slice(0, 8);
  const mx = Math.max(...cs.map(c => c.n), 1);
  const bw = (W - 8) / cs.length;
  let g = '';
  cs.forEach((c, i) => {
    const h = Math.max((c.n / mx) * (H - 20), 1);
    g += `<rect x="${4 + i * bw + 1}" y="${H - 13 - h}" width="${bw - 2}" height="${h}" fill="#6f9fd8" opacity=".6"><title>${esc(c.label)}: ${c.n}</title></rect>`;
  });
  g += `<line class="ax" x1="4" y1="${H - 13}" x2="${W - 4}" y2="${H - 13}"/>`;
  g += `<text class="axt" x="${W / 2}" y="${H - 2}" text-anchor="middle">cân bằng ${esc(L.class)} · lệch ${fmt(o.imbalance, 1)} lần</text>`;
  return svg(W, H, g);
}

/* Không có nhãn thì thay bằng phân bố độ sáng trung bình. */
function miniHist(o) {
  const W = 168, H = 62, h = o.lumHist;
  const x = scale(h.edges[0], h.edges[h.edges.length - 1], 4, W - 4);
  const y = scale(0, Math.max(...h.counts) * 1.08, H - 13, 3);
  let g = histBars(h, x, y, H - 13, '#6f9fd8', .55);
  g += `<line class="ax" x1="4" y1="${H - 13}" x2="${W - 4}" y2="${H - 13}"/>`;
  g += `<text class="axt" x="${W / 2}" y="${H - 2}" text-anchor="middle">phân bố độ sáng</text>`;
  return svg(W, H, g);
}

function renderSheet() {
  const d = P.datasets[state.ds];
  $('sheetTabs').innerHTML = SHEET_TABS.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === state.tab ? 'on' : ''}">${esc(label)}</button>`).join('');
  $('sheetIn').innerHTML =
    state.tab === 'algo' ? renderAlgoGlossary()
    : state.tab === 'concept' ? renderConcepts(state.ds, d.overview, P.meta)
    : renderExplorer(state.ds, d.overview, d.explore, P.meta);
  $('sheetIn').scrollTop = 0;
}

/* --- Tầng 2 và 3: thẻ chọn thuật toán, số lượng thay đổi theo bộ dữ liệu --- */
function renderCards() {
  $('dCards').innerHTML = P.meta.discrete.map(x =>
    `<button class="card${x.id === state.d ? ' on' : ''}" data-d="${esc(x.id)}" title="${esc(x.desc)}"><span class="ct">${esc(x.title)}</span><span class="cb">${esc(x.branch)}</span></button>`).join('');
  $('sCards').innerHTML = P.meta.stats.map(x =>
    `<button class="card stat${x.id === state.s ? ' on' : ''}" data-s="${esc(x.id)}" title="${esc(x.desc)}"><span class="ct">${esc(x.title)}</span><span class="cb">${esc(x.branch)}</span></button>`).join('');
}

/* --- Tầng 4: biểu đồ --- */
function renderViz() {
  const node = P.datasets[state.ds].discrete[state.d];
  const res = node.stats[state.s];
  const dMeta = D_META[state.d], sMeta = S_META[state.s];

  $('vizGrid').innerHTML =
    `<div class="panel"><h3>${esc(dMeta.title)}</h3><p class="ph">${esc(dMeta.desc)}</p>
      <div class="plot" id="plotD"></div></div>
     <div class="panel"><h3>${esc(sMeta.title)} · ${esc(sMeta.branch)}</h3><p class="ph">${esc(sMeta.desc)}</p>
      <div class="plot" id="plotS"></div></div>`;
  fillPlot($('plotD'), (w, h) => drawSafe(DISCRETE_DRAW, node.viz, w, h));
  fillPlot($('plotS'), (w, h) => drawSafe(STAT_DRAW, res.chart, w, h));
  $('metrics').style.gridTemplateColumns = `repeat(${res.metrics.length},minmax(0,1fr))`;
  $('metrics').innerHTML = res.metrics.map(m => {
    const v = typeof m.v === 'number' ? fmt(m.v) : String(m.v);
    return `<div class="metric" title="${esc(m.k)}: ${esc(v)}"><div class="mk">${esc(m.k)}</div><div class="mv">${esc(v)}</div></div>`;
  }).join('');
  $('verdict').innerHTML = `<span>Kết luận</span><b>${esc(res.verdict)}</b>`;
  $('pipe').innerHTML = `Ảnh <em>${esc(state.ds)}</em> → cấu trúc rời rạc <em>${esc(dMeta.title)}</em> → đại lượng phân tích <i>${esc(inputLabel(node, state.s))}</i> → phương pháp <i>${esc(sMeta.title)}</i>`;
}

/* Kind không có hàm vẽ tương ứng thì hiện khung trống kèm lý do, không để lỗi làm chết cả trang. */
function drawSafe(table, data, w, h) {
  const fn = table[data && data.kind];
  if (typeof fn !== 'function')
    return `<p class="ph">Chưa có hàm vẽ cho dạng "${esc(String(data && data.kind))}".</p>`;
  try { return fn(data, w, h); }
  catch (e) { return `<p class="ph">Không vẽ được: ${esc(e.message)}</p>`; }
}

/* Vẽ hai lượt: lượt đầu để biết chú giải chiếm bao nhiêu, lượt sau dựng đúng chiều cao còn lại. */
function fillPlot(el, draw) {
  const w = Math.max(el.clientWidth, 240);
  el.innerHTML = draw(w, Math.max(el.clientHeight - 30, 150));
  const lg = el.querySelector('.lg');
  const h = Math.max(el.clientHeight - (lg ? lg.offsetHeight + 6 : 0), 150);
  el.innerHTML = draw(w, h);
}

/* Cho biết tầng thống kê đang ăn đại lượng nào từ tầng rời rạc. */
function inputLabel(node, s) {
  const b = node.labels;
  if (s === 'shift' || s === 'sep') return `${b.groups.a} ⟷ ${b.groups.b}`;
  if (s === 'reg' || s === 'corr') return `${b.xy.x} ⟷ ${b.xy.y}`;
  if (s === 'drift') return b.seq;
  if (s === 'boot') return b.series;
  if (s === 'imb') return b.cells;
  if (s === 'noise') return b.nbr;
  return `${b.groups.a} ⟷ ${b.groups.b}`;
}

function renderMasthead() {
  const m = P.meta, tot = DS_LIST.reduce((a, d) => a + P.datasets[d].overview.rows, 0);
  document.title = m.title;
  $('mhTitle').textContent = m.title;
  $('mhNote').textContent = m.note;
  const combos = m.discrete.length * m.stats.length;
  $('mhTags').innerHTML =
    `<span class="tag">${fmt(tot, 0)} ${esc(L.entities)} phân tích trực tiếp từ điểm ảnh</span>` +
    `<span class="tag">${m.discrete.length} × ${m.stats.length} = ${combos} tổ hợp mỗi nguồn</span>` +
    (m.skipped.discrete.length + m.skipped.stats.length
      ? `<span class="tag">${m.skipped.discrete.length + m.skipped.stats.length} thuật toán bị khóa vì thiếu năng lực</span>` : '');
  $('layerSubData').textContent = m.source + (m.citation ? ' · ' + m.citation : '');
}

function renderAll() { renderData(); renderCards(); renderViz(); }
function openSheet(tab) { if (tab) state.tab = tab; renderSheet(); $('sheet').classList.add('on'); }

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { $('sheet').classList.remove('on'); return; }
  const b = e.target.closest('button');
  if (!b) { if (e.target.closest('#dataLayer')) openSheet(); return; }
  if (b.dataset.tab) { openSheet(b.dataset.tab); return; }
  if (!b.dataset.ds && b.closest('#dataLayer')) { openSheet(); return; }
  if (b.dataset.ds) state.ds = b.dataset.ds;
  else if (b.dataset.d) state.d = b.dataset.d;
  else if (b.dataset.s) state.s = b.dataset.s;
  else return;
  renderAll();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('sheet').classList.remove('on'); });
renderMasthead();
renderAll();

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderViz, 140); });
</script>
